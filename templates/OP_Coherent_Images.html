<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coherent Image Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .header p {
            color: #aaa;
            font-size: 1.1em;
        }

        .control-panel {
            background: rgba(22, 33, 62, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9em;
            color: #00d4ff;
            font-weight: 600;
        }

        button {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: #000;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.stop {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
        }

        .stats {
            background: rgba(22, 33, 62, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #00d4ff;
        }

        .images-section {
            margin-top: 40px;
        }

        .images-section h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-card {
            background: rgba(22, 33, 62, 0.8);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
            position: relative;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state p {
            font-size: 1.2em;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .status-indicator.active {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .status-indicator.inactive {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎨 Coherent Image Finder</h1>
            <p>Generates random images and finds coherent patterns using Shannon entropy analysis</p>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-row">
                <div class="control-group">
                    <label>Finder Status: <span class="status-indicator inactive" id="statusIndicator"></span><span id="statusText">Stopped</span></label>
                </div>
                <button id="startBtn" onclick="toggleFinder()">▶ Start Finder</button>
                <button id="stopBtn" class="stop" onclick="toggleFinder()" style="display:none;">⏹ Stop Finder</button>
                <button onclick="refreshImages()">🔄 Refresh Images</button>
            </div>
        </div>

        <!-- Task Statistics -->
        <div class="stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Runs</div>
                    <div class="stat-value" id="runsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Errors</div>
                    <div class="stat-value" id="errorsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Images Found</div>
                    <div class="stat-value" id="imagesCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Last Updated</div>
                    <div class="stat-value" id="lastUpdated" style="font-size: 1em;">--:--:--</div>
                </div>
            </div>
        </div>

        <!-- Images Gallery -->
        <div class="images-section">
            <h2>Generated Images</h2>
            <div class="image-grid" id="imageGrid">
                <div class="empty-state">
                    <p>Start the finder to generate coherent images...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let isFinderRunning = false;
        let statsUpdateInterval = null;
        let imageRefreshInterval = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            refreshImages();
            startAutoUpdate();
        });

        // Toggle finder start/stop
        function toggleFinder() {
            const finderBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            isFinderRunning = !isFinderRunning;

            if (isFinderRunning) {
                finderBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                updateStatusIndicator(true);
                startFinder();
            } else {
                finderBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
                updateStatusIndicator(false);
                stopFinder();
            }
        }

        // Enable/disable the finder task
        async function startFinder() {
            try {
                const response = await fetch('/owner_playground/api/tasks/coherent_image_finder/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                console.log('Finder started:', data);
            } catch (error) {
                console.error('Error starting finder:', error);
                isFinderRunning = false;
                toggleFinder(); // Reset UI
            }
        }

        async function stopFinder() {
            try {
                const response = await fetch('/owner_playground/api/tasks/coherent_image_finder/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                console.log('Finder stopped:', data);
            } catch (error) {
                console.error('Error stopping finder:', error);
            }
        }

        // Update task statistics
        async function updateStats() {
            try {
                const response = await fetch('/owner_playground/api/tasks/stats');
                const stats = await response.json();

                if (stats.coherent_image_finder) {
                    const task = stats.coherent_image_finder;
                    document.getElementById('runsCount').textContent = task.stats.runs;
                    document.getElementById('errorsCount').textContent = task.stats.errors;
                    isFinderRunning = task.enabled;
                    updateStatusIndicator(task.enabled);
                    updateStartStopButtons();
                }

                // Update last refresh time
                const now = new Date();
                document.getElementById('lastUpdated').textContent = now.toLocaleTimeString();
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        // Refresh image list and gallery
        async function refreshImages() {
            try {
                const response = await fetch('/owner_playground/api/images');
                const data = await response.json();
                const images = data.images || [];

                document.getElementById('imagesCount').textContent = images.length;

                const grid = document.getElementById('imageGrid');
                if (images.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><p>No coherent images generated yet...</p></div>';
                    return;
                }

                grid.innerHTML = images.map(img => `
                    <div class="image-card" onclick="openImage('${img.url}')">
                        <img src="${img.url}" alt="${img.filename}" loading="lazy">
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error refreshing images:', error);
            }
        }

        // Open image in new window
        function openImage(url) {
            window.open(url, '_blank');
        }

        // Update status indicator
        function updateStatusIndicator(active) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            if (active) {
                indicator.classList.remove('inactive');
                indicator.classList.add('active');
                text.textContent = 'Running';
            } else {
                indicator.classList.remove('active');
                indicator.classList.add('inactive');
                text.textContent = 'Stopped';
            }
        }

        // Update start/stop button display
        function updateStartStopButtons() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            if (isFinderRunning) {
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
            } else {
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
            }
        }

        // Start automatic updates
        function startAutoUpdate() {
            // Update stats every 2 seconds
            statsUpdateInterval = setInterval(updateStats, 2000);
            // Refresh images every 3 seconds
            imageRefreshInterval = setInterval(refreshImages, 3000);
        }

        // Stop automatic updates on page unload
        window.addEventListener('beforeunload', () => {
            if (statsUpdateInterval) clearInterval(statsUpdateInterval);
            if (imageRefreshInterval) clearInterval(imageRefreshInterval);
        });
    </script>
</body>
</html>
