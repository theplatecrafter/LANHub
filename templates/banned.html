<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied — LANHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c10; color: #c9d6e3;
      font-family: 'Courier New', monospace;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #0f1318; border: 1px solid #ff4d6a;
      border-top: 4px solid #ff4d6a;
      max-width: 480px; width: 100%; padding: 2.5rem;
      box-shadow: 0 0 40px rgba(255,77,106,0.15);
    }
    .icon { font-size: 2.5rem; margin-bottom: 16px; display: block; }
    h1 { font-size: 1.4rem; color: #ff4d6a; margin-bottom: 8px; letter-spacing: 0.05em; }
    .code { font-size: 0.72rem; color: #525a66; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
    p { font-size: 0.85rem; color: #7a8a98; line-height: 1.6; }
    .reason {
      margin-top: 16px; padding: 10px 14px;
      background: rgba(255,77,106,0.08); border: 1px solid rgba(255,77,106,0.3);
      font-size: 0.82rem; color: #c9d6e3; line-height: 1.5;
    }
    .reason strong { color: #ff4d6a; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🚫</span>
    <div class="code">HTTP 403 — Access Denied</div>
    <h1>You have been banned</h1>
    <p>Your IP address has been blocked from accessing this LANHub instance by a moderator or administrator.</p>
    {% if reason %}
    <div class="reason">
      <strong>Reason</strong>
      {{ reason }}
    </div>
    {% endif %}
    <p style="margin-top:16px; font-size:0.75rem; color:#525a66;">
      If you believe this is a mistake, contact the server administrator.
    </p>
  </div>
</body>
</html>
