{% extends "base.html" %}
{% block title %}LANHub — Polls{% endblock %}

{% block head %}
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .page-wrap {
    padding: 0 !important; flex: 1; display: flex;
    flex-direction: column; min-height: 0; overflow: hidden;
  }
  .container {
    max-width: 100% !important; padding: 0 !important;
    flex: 1; display: flex; min-height: 0; overflow: hidden;
  }

  /* ── Sidebar ──────────────────────────────────────────── */
  #polls-sidebar {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--bg-panel); border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .ps-section { border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ps-title {
    font-family: var(--font-mono); font-size: .62rem; text-transform: uppercase;
    letter-spacing: .15em; color: var(--text-dim); padding: 10px 16px 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .ps-title:hover { color: var(--text-bright); }
  .ps-title .arr { font-size: .55rem; transition: transform .15s; }
  .ps-title.col .arr { transform: rotate(-90deg); }
  .ps-body { padding: 12px 14px 14px; }
  .ps-body.hidden { display: none; }

  .p-fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .p-fg label {
    font-family: var(--font-mono); font-size: .6rem; text-transform: uppercase;
    letter-spacing: .1em; color: var(--text-dim);
  }
  .p-fg input, .p-fg textarea, .p-fg select {
    padding: 6px 9px; background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright);
    font-family: var(--font-mono); font-size: .78rem; outline: none;
    transition: border-color .15s; resize: none; width: 100%; box-sizing: border-box;
  }
  .p-fg input:focus, .p-fg textarea:focus, .p-fg select:focus { border-color: var(--cyan); }

  /* Options builder */
  #options-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .opt-row { display: flex; gap: 5px; align-items: center; }
  .opt-row input { flex: 1; }
  .opt-rm {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: .75rem;
    display: flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .opt-rm:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .add-opt-btn {
    width: 100%; padding: 5px; background: transparent;
    border: 1px dashed var(--border-hi); border-radius: var(--radius);
    color: var(--text-dim); font-family: var(--font-mono); font-size: .72rem;
    cursor: pointer; transition: all .12s;
  }
  .add-opt-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  /* tag chips */
  .p-tag-rel { position: relative; }
  .p-chip-wrap {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    padding: 5px 8px; min-height: 32px; background: var(--bg);
    border: 1px solid var(--border-hi); border-radius: var(--radius);
    cursor: text; transition: border-color .15s;
  }
  .p-chip-wrap:focus-within { border-color: var(--cyan); }
  .p-chip {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--cyan-dim); border: 1px solid var(--cyan);
    border-radius: 20px; padding: 1px 8px; font-family: var(--font-mono);
    font-size: .65rem; color: var(--cyan);
  }
  .p-chip-rm { cursor: pointer; opacity: .7; margin-left: 2px; }
  .p-chip-rm:hover { opacity: 1; }
  .p-tag-inp {
    border: none !important; background: transparent !important; outline: none;
    font-family: var(--font-mono); font-size: .72rem; color: var(--text-bright);
    flex: 1; min-width: 60px; padding: 2px 4px;
  }
  .p-tag-sug {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 160px;
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: var(--radius); z-index: 200; display: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .p-tag-sug.open { display: block; }
  .p-sug-item {
    padding: 6px 12px; font-family: var(--font-mono); font-size: .75rem;
    color: var(--text-dim); cursor: pointer;
  }
  .p-sug-item:hover, .p-sug-item.sel { background: var(--bg-hover); color: var(--cyan); }

  .p-submit-btn {
    width: 100%; padding: 9px; background: var(--cyan); color: var(--bg);
    border: none; border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; cursor: pointer; transition: opacity .15s;
  }
  .p-submit-btn:hover { opacity: .85; }
  #p-create-err { color: var(--red); font-family: var(--font-mono); font-size: .72rem; margin-top: 6px; min-height: 16px; }

  /* ── Main ─────────────────────────────────────────────── */
  #polls-main { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

  #polls-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #p-search {
    flex: 1; padding: 7px 12px; background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright);
    font-family: var(--font-mono); font-size: .8rem; outline: none; transition: border-color .15s;
  }
  #p-search:focus { border-color: var(--cyan); }
  #p-tag-active {
    display: none; align-items: center; gap: 6px; background: var(--cyan-dim);
    border: 1px solid var(--cyan); border-radius: 20px; padding: 3px 10px;
    font-family: var(--font-mono); font-size: .68rem; color: var(--cyan);
  }
  #p-tag-active.visible { display: flex; }
  #p-tag-clr { cursor: pointer; opacity: .7; }
  #p-tag-clr:hover { opacity: 1; }

  /* ── Poll grid ────────────────────────────────────────── */
  #polls-list {
    flex: 1; overflow-y: auto; padding: 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px; align-content: start;
  }
  #p-loading { grid-column: 1/-1; text-align: center; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); padding: 40px; }
  #p-empty   { grid-column: 1/-1; text-align: center; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); padding: 40px; display: none; }

  /* ── Normal poll card ─────────────────────────────────── */
  .poll-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column;
  }
  .poll-card:hover { border-color: var(--border-hi); transform: translateY(-2px); }

  .poll-card-header { padding: 16px 18px 12px; }
  .poll-type-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: .58rem; letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px; margin-bottom: 8px;
    background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border);
  }
  .poll-title {
    font-size: 1rem; font-weight: 700; color: var(--text-bright);
    margin-bottom: 4px; line-height: 1.3;
  }
  .poll-desc {
    font-size: .78rem; color: var(--text-dim); margin-bottom: 8px; line-height: 1.5;
  }
  .poll-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: .62rem; color: var(--text-dim);
  }
  .poll-tag-pill {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
    padding: 1px 7px; cursor: pointer; transition: border-color .1s;
  }
  .poll-tag-pill:hover { border-color: var(--cyan); color: var(--cyan); }

  /* Options / voting */
  .poll-options { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 7px; }

  .poll-option {
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
    padding: 8px 11px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg);
    transition: border-color .12s, background .12s;
    user-select: none;
  }
  .poll-option:hover:not(.voted-state) { border-color: var(--cyan); background: var(--bg-hover); }
  .poll-option.selected { border-color: var(--cyan); background: var(--cyan-dim); }
  .poll-option.voted-state { cursor: default; }

  .opt-top { display: flex; align-items: center; gap: 8px; }
  .opt-check {
    width: 15px; height: 15px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--border); transition: all .12s;
  }
  .multi-check { border-radius: 3px; }
  .poll-option.selected .opt-check {
    background: var(--cyan); border-color: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
  }
  .opt-label {
    font-family: var(--font-ui); font-size: .85rem; color: var(--text-bright); flex: 1;
  }
  .opt-count {
    font-family: var(--font-mono); font-size: .65rem; color: var(--text-dim); flex-shrink: 0;
  }

  .opt-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .opt-bar      { height: 100%; background: var(--cyan); border-radius: 2px; transition: width .4s ease; }
  .poll-option.selected .opt-bar { background: var(--cyan); }

  .poll-vote-btn {
    margin: 0 18px 14px; padding: 8px; background: var(--cyan); color: var(--bg);
    border: none; border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .72rem; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: .06em; transition: opacity .12s;
  }
  .poll-vote-btn:hover { opacity: .85; }
  .poll-vote-btn:disabled { opacity: .4; cursor: not-allowed; }

  .poll-footer {
    padding: 8px 18px 14px; display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: .65rem; color: var(--text-dim);
    border-top: 1px solid var(--border); margin-top: auto;
  }
  .voted-label { color: var(--green); }

  /* ── DEV poll card ────────────────────────────────────── */
  .poll-card.dev-poll {
    border: none; position: relative; overflow: visible;
    background: transparent;
  }
  .poll-card.dev-poll::before {
    content: '';
    position: absolute; inset: -2px; border-radius: calc(var(--radius) + 2px);
    background: linear-gradient(135deg, #00d4ff, #a78bfa, #f59e0b, #00d4ff);
    background-size: 300% 300%;
    animation: dev-border-anim 3s ease infinite;
    z-index: 0;
  }
  .poll-card.dev-poll::after {
    content: '';
    position: absolute; inset: 2px; border-radius: var(--radius);
    background: var(--bg-panel);
    z-index: 1;
  }
  @keyframes dev-border-anim {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .poll-card.dev-poll .poll-card-inner {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; height: 100%;
  }

  .dev-crown-banner {
    display: flex; align-items: center; gap: 8px; padding: 8px 18px;
    background: linear-gradient(90deg, rgba(245,166,35,.18), rgba(167,139,250,.12));
    border-bottom: 1px solid rgba(245,166,35,.3);
    font-family: var(--font-mono); font-size: .65rem; color: var(--amber);
    letter-spacing: .1em; text-transform: uppercase;
  }
  .dev-crown-banner .crown-glow {
    font-size: 1rem; filter: drop-shadow(0 0 6px var(--amber));
    animation: crown-pulse 2s ease-in-out infinite;
  }
  @keyframes crown-pulse {
    0%,100% { filter: drop-shadow(0 0 6px var(--amber)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 12px #f59e0b) drop-shadow(0 0 20px #a78bfa); transform: scale(1.1); }
  }
  .dev-poll .poll-title { color: var(--text-bright); font-size: 1.05rem; }
  .dev-poll .poll-type-badge {
    background: rgba(167,139,250,.15); color: #a78bfa; border-color: #a78bfa;
  }
  .dev-poll .poll-option.selected { border-color: #a78bfa; background: rgba(167,139,250,.12); }
  .dev-poll .poll-option.selected .opt-check { background: #a78bfa; border-color: #a78bfa; box-shadow: 0 0 8px #a78bfa; }
  .dev-poll .opt-bar { background: linear-gradient(90deg, #00d4ff, #a78bfa); }
  .dev-poll .poll-vote-btn {
    background: linear-gradient(90deg, #00d4ff, #a78bfa);
    color: #fff; font-weight: 800; letter-spacing: .1em;
  }
  .dev-delete-btn {
    margin: 0 18px 14px; padding: 6px; background: transparent;
    border: 1px solid var(--red); border-radius: var(--radius);
    color: var(--red); font-family: var(--font-mono); font-size: .68rem;
    cursor: pointer; transition: all .12s; text-transform: uppercase;
  }
  .dev-delete-btn:hover { background: var(--red-dim); }

  /* Toast */
  #p-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: var(--radius); padding: 9px 20px; font-family: var(--font-mono);
    font-size: .78rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 700;
  }
  #p-toast.show { opacity: 1; }
  #p-toast.ok  { border-color: var(--green); color: var(--green); }
  #p-toast.err { border-color: var(--red);   color: var(--red); }
</style>
{% endblock %}

{% block content %}
<div id="p-toast"></div>

<div style="display:flex; flex:1; min-height:0;">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <div id="polls-sidebar">
    <div class="ps-section">
      <div class="ps-title" onclick="togglePs('ps-create-body', this)">
        <span>＋ Create Poll</span><span class="arr">▼</span>
      </div>
      <div class="ps-body" id="ps-create-body">

        <div class="p-fg">
          <label>Title <span style="color:var(--red)">*</span></label>
          <input type="text" id="pc-title" placeholder="What do you want to ask?" maxlength="120" autocomplete="off" />
        </div>

        <div class="p-fg">
          <label>Description</label>
          <textarea id="pc-desc" rows="2" placeholder="Optional context…" maxlength="500"></textarea>
        </div>

        <div class="p-fg">
          <label>Type</label>
          <select id="pc-type">
            <option value="single">Single choice</option>
            <option value="multi">Multiple choice</option>
          </select>
        </div>

        <div class="p-fg">
          <label>Options <span style="color:var(--red)">*</span></label>
          <div id="options-list">
            <div class="opt-row"><input type="text" placeholder="Option 1" maxlength="120" /><button class="opt-rm" onclick="removeOpt(this)" title="Remove">✕</button></div>
            <div class="opt-row"><input type="text" placeholder="Option 2" maxlength="120" /><button class="opt-rm" onclick="removeOpt(this)" title="Remove">✕</button></div>
          </div>
          <button class="add-opt-btn" onclick="addOpt()">＋ Add option</button>
        </div>

        <div class="p-fg">
          <label>Tags</label>
          <div class="p-tag-rel">
            <div class="p-chip-wrap" id="pc-chips" onclick="document.getElementById('pc-tag-inp').focus()">
              <input type="text" id="pc-tag-inp" class="p-tag-inp" placeholder="tag…" autocomplete="off" />
            </div>
            <div id="pc-tag-sug" class="p-tag-sug"></div>
          </div>
        </div>

        <button class="p-submit-btn" onclick="submitPoll()">Create Poll</button>
        <div id="p-create-err"></div>

      </div>
    </div>
  </div><!-- /sidebar -->

  <!-- ── Main ───────────────────────────────────────────── -->
  <div id="polls-main">
    <div id="polls-toolbar">
      <input type="text" id="p-search" placeholder="Search polls…" oninput="pDebounce()" />
      <div id="p-tag-active">
        <span id="p-tag-label"></span>
        <span id="p-tag-clr" onclick="clearPTagFilter()">✕</span>
      </div>
    </div>
    <div id="polls-list">
      <div id="p-loading">Loading…</div>
      <div id="p-empty">No polls found.</div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  // ── State ────────────────────────────────────────────────
  let pActiveTag = "";
  let pDebTimer  = null;
  let pollTags   = [];
  let tagSugSel  = -1;
  window._isDev  = false;
  fetch("/admin/is_dev_session").then(r=>r.json()).then(d=>{ window._isDev=!!d.is_dev; }).catch(()=>{});

  // ── Sidebar section toggle ───────────────────────────────
  function togglePs(bodyId, titleEl) {
    document.getElementById(bodyId).classList.toggle("hidden");
    titleEl.classList.toggle("col");
  }

  // ── Options builder ──────────────────────────────────────
  function addOpt() {
    const list  = document.getElementById("options-list");
    const count = list.children.length + 1;
    if (count > 20) return;
    const row = document.createElement("div"); row.className = "opt-row";
    row.innerHTML = `<input type="text" placeholder="Option ${count}" maxlength="120" /><button class="opt-rm" onclick="removeOpt(this)" title="Remove">✕</button>`;
    list.appendChild(row);
  }
  function removeOpt(btn) {
    const list = document.getElementById("options-list");
    if (list.children.length <= 2) return;
    btn.closest(".opt-row").remove();
  }

  // ── Tag chips ────────────────────────────────────────────
  const pcTagInp = document.getElementById("pc-tag-inp");
  const pcTagSug = document.getElementById("pc-tag-sug");

  pcTagInp.addEventListener("input", async () => {
    const v = pcTagInp.value.trim();
    if (!v) { closePcSug(); return; }
    const res = await fetch("/api/polls/tags?q=" + encodeURIComponent(v));
    const d   = await res.json();
    renderPcSug(d.tags);
  });
  pcTagInp.addEventListener("keydown", e => {
    const items = pcTagSug.querySelectorAll(".p-sug-item");
    if (e.key==="ArrowDown") { e.preventDefault(); tagSugSel=Math.min(tagSugSel+1,items.length-1); items.forEach((el,i)=>el.classList.toggle("sel",i===tagSugSel)); }
    else if (e.key==="ArrowUp") { e.preventDefault(); tagSugSel=Math.max(tagSugSel-1,-1); items.forEach((el,i)=>el.classList.toggle("sel",i===tagSugSel)); }
    else if (e.key==="Enter"||e.key===",") { e.preventDefault(); const c=tagSugSel>=0?items[tagSugSel]?.textContent:pcTagInp.value.trim().replace(/,$/,""); if(c) addPTag(c); }
    else if (e.key==="Backspace"&&!pcTagInp.value&&pollTags.length) removePTag(pollTags[pollTags.length-1]);
    else if (e.key==="Escape") closePcSug();
  });
  pcTagInp.addEventListener("blur", () => setTimeout(()=>{ const v=pcTagInp.value.trim().replace(/,$/,""); if(v) addPTag(v); closePcSug(); },150));

  function renderPcSug(tags) {
    if (!tags.length) { closePcSug(); return; }
    tagSugSel=-1;
    pcTagSug.innerHTML = tags.map(t=>`<div class="p-sug-item" onmousedown="addPTag('${escHtml(t)}')">${escHtml(t)}</div>`).join("");
    pcTagSug.classList.add("open");
  }
  function closePcSug() { pcTagSug.classList.remove("open"); pcTagSug.innerHTML=""; tagSugSel=-1; }
  function addPTag(tag) {
    tag=tag.trim().toLowerCase();
    if (!tag||pollTags.includes(tag)) { pcTagInp.value=""; closePcSug(); return; }
    pollTags.push(tag); renderPChips(); pcTagInp.value=""; closePcSug();
  }
  function removePTag(tag) { pollTags=pollTags.filter(t=>t!==tag); renderPChips(); }
  function renderPChips() {
    const wrap=document.getElementById("pc-chips");
    wrap.querySelectorAll(".p-chip").forEach(el=>el.remove());
    pollTags.forEach(tag=>{
      const c=document.createElement("span"); c.className="p-chip";
      c.innerHTML=`${escHtml(tag)}<span class="p-chip-rm" onclick="removePTag('${escHtml(tag)}')">✕</span>`;
      wrap.insertBefore(c,pcTagInp);
    });
  }

  // ── Submit poll ──────────────────────────────────────────
  async function submitPoll() {
    const title = document.getElementById("pc-title").value.trim();
    const desc  = document.getElementById("pc-desc").value.trim();
    const type  = document.getElementById("pc-type").value;
    const err   = document.getElementById("p-create-err");
    const opts  = [...document.querySelectorAll("#options-list .opt-row input")]
                    .map(i=>i.value.trim()).filter(Boolean);
    if (!title)      { err.textContent="Title is required."; return; }
    if (opts.length<2){ err.textContent="At least 2 options required."; return; }
    err.textContent="";

    const body = new FormData();
    body.append("title", title);
    body.append("description", desc);
    body.append("poll_type", type);
    body.append("tags", pollTags.join(","));
    opts.forEach(o => body.append("options", o));

    const res  = await fetch("/api/polls/create", { method:"POST", body });
    const data = await res.json();
    if (data.ok) {
      showPToast("Poll created!", true);
      document.getElementById("pc-title").value="";
      document.getElementById("pc-desc").value="";
      document.querySelectorAll("#options-list .opt-row").forEach((r,i)=>{ if(i>1) r.remove(); else r.querySelector("input").value=""; });
      pollTags=[]; renderPChips();
      loadPolls();
    } else {
      err.textContent=data.error;
    }
  }

  // ── Filters ──────────────────────────────────────────────
  function filterByPTag(tag) {
    pActiveTag=tag;
    document.getElementById("p-tag-label").textContent="#"+tag;
    document.getElementById("p-tag-active").classList.add("visible");
    loadPolls();
  }
  function clearPTagFilter() {
    pActiveTag="";
    document.getElementById("p-tag-active").classList.remove("visible");
    loadPolls();
  }
  function pDebounce() {
    clearTimeout(pDebTimer);
    pDebTimer=setTimeout(loadPolls,300);
  }

  // ── Load polls ────────────────────────────────────────────
  async function loadPolls() {
    document.getElementById("p-loading").style.display="block";
    document.getElementById("p-empty").style.display="none";
    document.querySelectorAll(".poll-card").forEach(el=>el.remove());

    const q = document.getElementById("p-search").value.trim();
    let url = `/api/polls/search?q=${encodeURIComponent(q)}`;
    if (pActiveTag) url += `&tag=${encodeURIComponent(pActiveTag)}`;

    const res  = await fetch(url);
    const data = await res.json();
    document.getElementById("p-loading").style.display="none";
    if (!data.results.length) { document.getElementById("p-empty").style.display="block"; return; }
    data.results.forEach(p => {
      document.getElementById("polls-list").appendChild(makePollCard(p));
    });
  }

  // ── Build poll card ───────────────────────────────────────
  // Per-card selection state (before voting)
  const cardSel = {}; // { pollId: Set<optionId> }

  function makePollCard(poll) {
    const isDev = !!poll.is_dev;
    const card  = document.createElement("div");
    card.className = "poll-card" + (isDev ? " dev-poll" : "");
    card.id = "poll-card-" + poll.id;

    const inner = document.createElement("div");
    inner.className = isDev ? "poll-card-inner" : "";

    const typeLabel = poll.poll_type==="multi" ? "☑ Multiple choice" : "◉ Single choice";
    const tags = (poll.tags||[]).map(t=>
      `<span class="poll-tag-pill" onclick="filterByPTag('${escHtml(t)}')">#${escHtml(t)}</span>`
    ).join(" ");

    const headerHTML = `
      ${isDev ? `
        <div class="dev-crown-banner">
          <span class="crown-glow">👑</span>
          <span>Official Poll by ${escHtml(poll.created_by||"DEV")}</span>
        </div>` : ""}
      <div class="poll-card-header">
        <div class="poll-type-badge">${typeLabel}</div>
        <div class="poll-title">${escHtml(poll.title)}</div>
        ${poll.description ? `<div class="poll-desc">${escHtml(poll.description)}</div>` : ""}
        <div class="poll-meta">
          <span>${escHtml(poll.time_str)}</span>
          ${tags}
        </div>
      </div>
    `;
    inner.innerHTML = headerHTML;

    // Options
    const optsDiv = document.createElement("div");
    optsDiv.className = "poll-options";
    optsDiv.id = `poll-opts-${poll.id}`;

    cardSel[poll.id] = new Set();

    poll.options.forEach(opt => {
      optsDiv.appendChild(makeOptEl(poll, opt));
    });
    inner.appendChild(optsDiv);

    // Vote button (hidden if already voted)
    if (!poll.viewer_voted) {
      const vbtn = document.createElement("button");
      vbtn.className = "poll-vote-btn"; vbtn.id = `vote-btn-${poll.id}`;
      vbtn.textContent = "Cast Vote"; vbtn.disabled = true;
      vbtn.onclick = () => castVote(poll.id, poll.poll_type);
      inner.appendChild(vbtn);
    }

    // DEV delete button
    if (window._isDev) {
      const dbtn = document.createElement("button");
      dbtn.className = "dev-delete-btn";
      dbtn.textContent = "🗑 Delete Poll";
      dbtn.onclick = async () => {
        if (!confirm("Delete this poll permanently?")) return;
        const res = await fetch(`/api/polls/${poll.id}/delete`, {method:"POST"});
        const d   = await res.json();
        if (d.ok) { card.remove(); showPToast("Poll deleted.",true); }
        else showPToast(d.error, false);
      };
      inner.appendChild(dbtn);
    }

    // Footer
    const footer = document.createElement("div");
    footer.className = "poll-footer";
    footer.id = `poll-footer-${poll.id}`;
    footer.innerHTML = `
      <span id="poll-votes-${poll.id}">${poll.total_votes} ${poll.total_votes===1?"response":"responses"}</span>
      ${poll.viewer_voted ? `<span class="voted-label" style="margin-left:auto">✓ You voted</span>` : ""}
    `;
    inner.appendChild(footer);

    card.appendChild(inner);
    return card;
  }

  function makeOptEl(poll, opt) {
    const isVotedState = poll.viewer_voted;
    const el = document.createElement("div");
    el.className = "poll-option" + (isVotedState ? " voted-state" : "") + (opt.viewer_voted ? " selected" : "");
    el.id = `opt-${poll.id}-${opt.id}`;
    el.dataset.optId = opt.id;
    el.dataset.pollId = poll.id;

    const checkClass = poll.poll_type==="multi" ? "opt-check multi-check" : "opt-check";
    el.innerHTML = `
      <div class="opt-top">
        <div class="${checkClass}" id="chk-${poll.id}-${opt.id}"></div>
        <span class="opt-label">${escHtml(opt.label)}</span>
        ${isVotedState ? `<span class="opt-count">${opt.votes} (${opt.pct}%)</span>` : ""}
      </div>
      ${isVotedState ? `<div class="opt-bar-wrap"><div class="opt-bar" style="width:${opt.pct}%"></div></div>` : ""}
    `;

    if (!isVotedState) {
      el.addEventListener("click", () => toggleOpt(poll.id, opt.id, poll.poll_type));
    }
    return el;
  }

  function toggleOpt(pollId, optId, pollType) {
    const sel = cardSel[pollId];
    if (!sel) return;

    if (pollType==="single") {
      // Deselect all others first
      sel.clear();
      document.querySelectorAll(`[data-poll-id="${pollId}"]`).forEach(el => {
        el.classList.remove("selected");
      });
    }

    if (sel.has(optId)) {
      sel.delete(optId);
      document.getElementById(`opt-${pollId}-${optId}`)?.classList.remove("selected");
    } else {
      sel.add(optId);
      document.getElementById(`opt-${pollId}-${optId}`)?.classList.add("selected");
    }

    const btn = document.getElementById(`vote-btn-${pollId}`);
    if (btn) btn.disabled = sel.size === 0;
  }

  async function castVote(pollId, pollType) {
    const sel = cardSel[pollId];
    if (!sel || sel.size === 0) return;

    const body = new FormData();
    sel.forEach(id => body.append("option_ids", id));

    const res  = await fetch(`/api/polls/${pollId}/vote`, {method:"POST", body});
    const data = await res.json();
    if (!data.ok) { showPToast(data.error, false); return; }

    // Re-render the card in place
    const card    = document.getElementById(`poll-card-${pollId}`);
    const newCard = makePollCard(data.poll);
    card.replaceWith(newCard);
    showPToast("Vote cast!", true);
  }

  // ── Helpers ───────────────────────────────────────────────
  function showPToast(msg, ok) {
    const el = document.getElementById("p-toast");
    el.textContent=msg; el.className="show "+(ok?"ok":"err");
    clearTimeout(el._t);
    el._t=setTimeout(()=>{ el.className=ok?"ok":"err"; },3000);
  }
  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Boot ─────────────────────────────────────────────────
  loadPolls();
</script>
{% endblock %}
