{% extends "base.html" %}

{% block title %}ラボが無効です{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box">
        <h1>ラボは無効です</h1>
        <p>このサーバーでは LANHub ラボ機能は現在無効になっています。</p>
        <p>この機能を有効にするにはサーバー管理者にお問い合わせください。</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">ホームに戻る</a>
    </div>
</div>

<style>
.error-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.error-box {
    background: white;
    padding: 40px;
    border-radius: 8px;
    text-align: center;
    max-width: 500px;
}

.error-box h1 {
    margin: 0 0 20px;
    color: #333;
}

.error-box p {
    margin: 0 0 15px;
    color: #666;
}

.error-box .btn {
    margin-top: 20px;
}
</style>
{% endblock %}
