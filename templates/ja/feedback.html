{% extends "base.html" %}
{% block title %}HansHub — フィードバック{% endblock %}

{% block head %}
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .page-wrap {
    padding: 0 !important; flex: 1; display: flex;
    flex-direction: column; min-height: 0; overflow: hidden;
  }
  .container {
    max-width: 100% !important; padding: 0 !important;
    flex: 1; display: flex; min-height: 0; overflow: hidden;
  }

  /* ── Sidebar ──────────────────────────────────────────── */
  #fb-sidebar {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--bg-panel); border-right: 1px solid var(--border);
    overflow-y: auto; overflow-x: hidden;
  }

  .fb-section { border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .fb-section-title {
    font-family: var(--font-mono); font-size: .62rem; text-transform: uppercase;
    letter-spacing: .15em; color: var(--text-dim); padding: 10px 16px 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .fb-section-title:hover { color: var(--text-bright); }
  .fb-section-title .arr { font-size: .55rem; transition: transform .15s; }
  .fb-section-title.col .arr { transform: rotate(-90deg); }
  .fb-section-body { padding: 12px 14px 14px; }
  .fb-section-body.hidden { display: none; }

  .fb-fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .fb-fg label {
    font-family: var(--font-mono); font-size: .6rem; text-transform: uppercase;
    letter-spacing: .1em; color: var(--text-dim);
  }
  .fb-fg input, .fb-fg textarea, .fb-fg select {
    padding: 6px 9px; background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright);
    font-family: var(--font-mono); font-size: .78rem; outline: none;
    transition: border-color .15s; resize: none; width: 100%;
  }
  .fb-fg input:focus, .fb-fg textarea:focus, .fb-fg select:focus { border-color: var(--cyan); }

  /* tag chips (reusing dropzone style names with fb- prefix) */
  .fb-chip-wrap {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    padding: 5px 8px; min-height: 32px; background: var(--bg);
    border: 1px solid var(--border-hi); border-radius: var(--radius);
    cursor: text; transition: border-color .15s;
  }
  .fb-chip-wrap:focus-within { border-color: var(--cyan); }
  .fb-chip {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--cyan-dim); border: 1px solid var(--cyan);
    border-radius: 20px; padding: 1px 8px; font-family: var(--font-mono);
    font-size: .65rem; color: var(--cyan);
  }
  .fb-chip-rm { cursor: pointer; opacity: .7; margin-left: 2px; }
  .fb-chip-rm:hover { opacity: 1; }
  .fb-tag-input {
    border: none !important; background: transparent !important;
    outline: none; font-family: var(--font-mono); font-size: .72rem;
    color: var(--text-bright); flex: 1; min-width: 60px; padding: 2px 4px;
  }
  .fb-tag-sug {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 160px;
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: var(--radius); z-index: 200; display: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .fb-tag-sug.open { display: block; }
  .fb-sug-item {
    padding: 6px 12px; font-family: var(--font-mono); font-size: .75rem;
    color: var(--text-dim); cursor: pointer;
  }
  .fb-sug-item:hover, .fb-sug-item.sel { background: var(--bg-hover); color: var(--cyan); }
  .fb-tag-rel { position: relative; }

  .fb-create-btn {
    width: 100%; padding: 8px; background: var(--cyan); color: var(--bg);
    border: none; border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    cursor: pointer; transition: opacity .15s; font-weight: 700;
  }
  .fb-create-btn:hover { opacity: .85; }
  #fb-create-err { color: var(--red); font-size: .72rem; margin-top: 6px; min-height: 16px; }

  /* ── Main ─────────────────────────────────────────────── */
  #fb-main {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: var(--bg);
  }

  #fb-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap;
  }
  #fb-search {
    flex: 1; min-width: 160px; padding: 7px 12px;
    background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright);
    font-family: var(--font-mono); font-size: .8rem; outline: none;
    transition: border-color .15s;
  }
  #fb-search:focus { border-color: var(--cyan); }

  .fb-filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-family: var(--font-mono);
    font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .fb-filter-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .fb-filter-btn.active { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }

  #fb-tag-active {
    display: none; align-items: center; gap: 6px; background: var(--cyan-dim);
    border: 1px solid var(--cyan); border-radius: 20px; padding: 3px 10px;
    font-family: var(--font-mono); font-size: .68rem; color: var(--cyan);
  }
  #fb-tag-active.visible { display: flex; }
  #fb-tag-clear { cursor: pointer; opacity: .7; }
  #fb-tag-clear:hover { opacity: 1; }

  /* ── Cards ────────────────────────────────────────────── */
  #fb-list {
    flex: 1; overflow-y: auto; padding: 14px 18px; display: flex;
    flex-direction: column; gap: 12px;
  }
  #fb-empty { text-align: center; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); padding: 40px; display: none; }
  #fb-loading { text-align: center; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); padding: 40px; }

  .fb-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color .15s;
  }
  .fb-card:hover { border-color: var(--border-hi); }
  .fb-card.resolved { opacity: .72; border-style: dashed; }

  .fb-card-header {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px 10px; cursor: pointer;
  }
  .fb-card-header:hover .fb-title { color: var(--cyan); }

  .type-badge {
    font-family: var(--font-mono); font-size: .6rem; letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
    flex-shrink: 0; margin-top: 2px;
  }
  .type-badge.bug     { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red); }
  .type-badge.feature { background: var(--cyan-dim);   color: var(--cyan);   border: 1px solid var(--cyan); }
  .type-badge.other   { background: var(--bg-card);    color: var(--text-dim); border: 1px solid var(--border); }

  .fb-card-body { flex: 1; min-width: 0; }
  .fb-title { font-size: .95rem; color: var(--text-bright); font-weight: 600; word-break: break-word; }
  .fb-desc  { font-size: .8rem; color: var(--text-dim); margin-top: 4px; word-break: break-word; }
  .fb-meta  {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 8px; font-family: var(--font-mono); font-size: .65rem; color: var(--text-dim);
  }
  .fb-username { color: var(--text); }
  .fb-time     {}
  .fb-tag-pill {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
    padding: 1px 7px; cursor: pointer; transition: border-color .1s;
  }
  .fb-tag-pill:hover { border-color: var(--cyan); color: var(--cyan); }

  .resolved-badge {
    font-family: var(--font-mono); font-size: .6rem; letter-spacing: .08em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
    background: var(--green-dim, rgba(57,217,138,.15));
    color: var(--green); border: 1px solid var(--green);
  }

  /* Star button */
  .fb-star-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    flex-shrink: 0; background: none; border: none; cursor: pointer;
    padding: 6px 8px; border-radius: var(--radius); color: var(--text-dim);
    font-family: var(--font-mono); font-size: .7rem; transition: all .12s;
    margin-left: auto;
  }
  .fb-star-btn:hover { color: var(--amber); }
  .fb-star-btn.starred { color: var(--amber); }
  .fb-star-btn .star-icon { font-size: 1.2rem; line-height: 1; }

  /* ── Replies ──────────────────────────────────────────── */
  .fb-replies-wrap { display: none; border-top: 1px solid var(--border); }
  .fb-replies-wrap.open { display: block; }

  .fb-reply-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  .fb-reply {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px;
  }
  .fb-reply.dev-reply { border-color: var(--amber); background: rgba(245,166,35,.05); }
  .fb-reply-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    font-family: var(--font-mono); font-size: .7rem;
  }
  .fb-reply-user { color: var(--text-bright); font-weight: 600; }
  .fb-reply-crown { color: var(--amber); font-size: .85rem; }
  .fb-reply-time  { color: var(--text-dim); margin-left: auto; }
  .fb-reply-body  { font-size: .82rem; color: var(--text); word-break: break-word; }

  .fb-reply-form { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .fb-reply-form textarea {
    width: 100%; resize: vertical; min-height: 56px;
    padding: 7px 10px; background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright);
    font-family: var(--font-ui); font-size: .82rem; outline: none;
    transition: border-color .15s; box-sizing: border-box;
  }
  .fb-reply-form textarea:focus { border-color: var(--cyan); }
  .fb-reply-row { display: flex; gap: 8px; align-items: center; }
  .fb-reply-btn {
    padding: 6px 16px; background: var(--cyan); color: var(--bg);
    border: none; border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .72rem; cursor: pointer; font-weight: 700; transition: opacity .12s;
  }
  .fb-reply-btn:hover { opacity: .85; }
  .fb-reply-err { color: var(--red); font-family: var(--font-mono); font-size: .7rem; }

  .fb-toggle-replies {
    display: flex; align-items: center; gap: 6px; padding: 6px 16px 10px;
    font-family: var(--font-mono); font-size: .68rem; color: var(--text-dim);
    cursor: pointer; background: none; border: none; text-align: left;
  }
  .fb-toggle-replies:hover { color: var(--cyan); }

  /* Resolve section (DEV) */
  .fb-resolve-wrap { padding: 0 16px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fb-resolve-input {
    flex: 1; min-width: 160px; padding: 6px 10px; background: var(--bg);
    border: 1px solid var(--border-hi); border-radius: var(--radius);
    color: var(--text-bright); font-family: var(--font-mono); font-size: .75rem; outline: none;
  }
  .fb-resolve-input:focus { border-color: var(--green); }
  .fb-resolve-btn {
    padding: 6px 14px; background: transparent; border: 1px solid var(--green);
    color: var(--green); border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .7rem; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .fb-resolve-btn:hover { background: var(--green); color: var(--bg); }

  .fb-resolved-note {
    padding: 8px 16px 12px; font-family: var(--font-mono); font-size: .72rem;
    color: var(--green); border-top: 1px solid var(--border);
  }
  .fb-resolved-note strong { color: var(--amber); }

  /* Username modal */
  .fb-modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 600;
    align-items: center; justify-content: center;
  }
  .fb-modal-bg.open { display: flex; }
  .fb-modal-box {
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: var(--radius); padding: 28px; min-width: 300px; max-width: 380px;
  }
  .fb-modal-box h3 { margin: 0 0 6px; font-size: 1rem; }
  .fb-modal-box p  { font-family: var(--font-mono); font-size: .72rem; color: var(--text-dim); margin: 0 0 14px; }
  .fb-modal-box input {
    width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: var(--radius); color: var(--text-bright); font-family: var(--font-mono);
    font-size: .85rem; outline: none; margin-bottom: 6px; box-sizing: border-box;
  }
  .fb-modal-box input:focus { border-color: var(--cyan); }
  .fb-modal-err { color: var(--red); font-family: var(--font-mono); font-size: .72rem; min-height: 16px; }
  .fb-modal-btn {
    width: 100%; margin-top: 12px; padding: 9px; background: var(--cyan); color: var(--bg);
    border: none; border-radius: var(--radius); font-family: var(--font-mono);
    font-size: .8rem; font-weight: 700; cursor: pointer; transition: opacity .12s;
  }
  .fb-modal-btn:hover { opacity: .85; }

  #fb-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    border-radius: var(--radius); padding: 9px 20px; font-family: var(--font-mono);
    font-size: .78rem; opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 700;
  }
  #fb-toast.show { opacity: 1; }
  #fb-toast.ok  { border-color: var(--green); color: var(--green); }
  #fb-toast.err { border-color: var(--red);   color: var(--red); }
</style>
{% endblock %}

{% block content %}

<!-- Username modal (shared for create + reply) -->
<div class="fb-modal-bg" id="un-modal">
  <div class="fb-modal-box">
    <h3>👤 ユーザー名を設定</h3>
    <p>この名前が投稿や返信に表示されます。セッション中のみ保持されます。</p>
    <input type="text" id="un-input" maxlength="32" placeholder="ユーザー名…" autocomplete="off" />
    <div class="fb-modal-err" id="un-err"></div>
    <button class="fb-modal-btn" onclick="submitUsername()">次へ →</button>
  </div>
</div>

<div id="fb-toast"></div>

<div style="display:flex; flex:1; min-height:0;">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <div id="fb-sidebar">

    <!-- Create form -->
    <div class="fb-section">
      <div class="fb-section-title" onclick="toggleFbSection('create-body', this)">
        <span>＋ 新規投稿</span><span class="arr">▼</span>
      </div>
      <div class="fb-section-body" id="create-body">

        <div class="fb-fg">
          <label>種別 <span style="color:var(--red)">*</span></label>
          <select id="fc-type">
            <option value="bug">🐛 バグ報告</option>
            <option value="feature">✨ 機能要望</option>
            <option value="other">📋 その他</option>
          </select>
        </div>

        <div class="fb-fg">
          <label>タイトル <span style="color:var(--red)">*</span></label>
          <input type="text" id="fc-title" placeholder="簡潔な要約…" maxlength="120" autocomplete="off" />
        </div>

        <div class="fb-fg">
          <label>説明</label>
          <textarea id="fc-desc" rows="3" placeholder="詳細、再現手順など…" maxlength="2000"></textarea>
        </div>

        <div class="fb-fg">
          <label>タグ</label>
          <div class="fb-tag-rel">
            <div class="fb-chip-wrap" id="fc-chips" onclick="document.getElementById('fc-tag-inp').focus()">
              <input type="text" id="fc-tag-inp" class="fb-tag-input" placeholder="タグ…" autocomplete="off" />
            </div>
            <div id="fc-tag-sug" class="fb-tag-sug"></div>
          </div>
        </div>

        <button class="fb-create-btn" onclick="submitCreate()">送信</button>
        <div id="fb-create-err"></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="fb-section">
      <div class="fb-section-title" style="cursor:default">
        <span>🔍 フィルター</span>
      </div>
      <div class="fb-section-body">
        <div style="display:flex; flex-wrap:wrap; gap:5px;">
          <button class="fb-filter-btn active" data-type="" onclick="setTypeFilter(this)">すべて</button>
          <button class="fb-filter-btn" data-type="bug" onclick="setTypeFilter(this)">🐛 バグ</button>
          <button class="fb-filter-btn" data-type="feature" onclick="setTypeFilter(this)">✨ 機能要望</button>
          <button class="fb-filter-btn" data-type="other" onclick="setTypeFilter(this)">📋 その他</button>
        </div>
      </div>
    </div>

  </div><!-- /sidebar -->

  <!-- ── Main ───────────────────────────────────────────── -->
  <div id="fb-main">

    <div id="fb-toolbar">
      <input type="text" id="fb-search" placeholder="タイトル、説明、ユーザー名で検索…"
             oninput="debounce()" />
      <div id="fb-tag-active">
        <span id="fb-tag-label"></span>
        <span id="fb-tag-clear" onclick="clearTagFilter()">✕</span>
      </div>
    </div>

    <div id="fb-list">
      <div id="fb-loading">読み込み中…</div>
      <div id="fb-empty">投稿が見つかりませんでした。</div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // ── State ────────────────────────────────────────────────
  let fbUsername = null;
  let activeType   = "";
  let activeTag    = "";
  let debTimer     = null;
  let createTags   = [];
  let tagSugSel    = -1;
  let pendingAction = null;  // { type: "create"|"reply", fb_id? } — queued if username not set

  // ── Username modal ───────────────────────────────────────
  function requireUsername(callback) {
    if (fbUsername) { callback(); return; }
    pendingAction = callback;
    document.getElementById("un-modal").classList.add("open");
    setTimeout(() => document.getElementById("un-input").focus(), 100);
  }

  document.getElementById("un-input").addEventListener("keydown", e => {
    if (e.key === "Enter") submitUsername();
  });

  function submitUsername() {
    const val = document.getElementById("un-input").value.trim();
    const err = document.getElementById("un-err");
    if (!val)            { err.textContent = "ユーザー名を入力してください。"; return; }
    if (val.length > 32) { err.textContent = "32文字以内で入力してください。"; return; }
    err.textContent = "";
    fbUsername = val;
    document.getElementById("un-modal").classList.remove("open");
    if (pendingAction) { const cb = pendingAction; pendingAction = null; cb(); }
}

  // ── Sidebar section toggle ───────────────────────────────
  function toggleFbSection(bodyId, titleEl) {
    const body = document.getElementById(bodyId);
    body.classList.toggle("hidden");
    titleEl.classList.toggle("col");
  }

  // ── Tag chip system (sidebar create form) ────────────────
  const fcTagInp = document.getElementById("fc-tag-inp");
  const fcTagSug = document.getElementById("fc-tag-sug");

  fcTagInp.addEventListener("input", async () => {
    const v = fcTagInp.value.trim();
    if (!v) { closeFcSug(); return; }
    const res  = await fetch("/api/feedback/tags?q=" + encodeURIComponent(v));
    const data = await res.json();
    renderFcSug(data.tags);
  });
  fcTagInp.addEventListener("keydown", e => {
    const items = fcTagSug.querySelectorAll(".fb-sug-item");
    if (e.key === "ArrowDown") { e.preventDefault(); tagSugSel = Math.min(tagSugSel+1, items.length-1); items.forEach((el,i)=>el.classList.toggle("sel",i===tagSugSel)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); tagSugSel = Math.max(tagSugSel-1,-1); items.forEach((el,i)=>el.classList.toggle("sel",i===tagSugSel)); }
    else if (e.key==="Enter"||e.key===",") { e.preventDefault(); const c = tagSugSel>=0 ? items[tagSugSel]?.textContent : fcTagInp.value.trim().replace(/,$/,""); if(c) addFcTag(c); }
    else if (e.key==="Backspace"&&!fcTagInp.value&&createTags.length) { removeFcTag(createTags[createTags.length-1]); }
    else if (e.key==="Escape") { closeFcSug(); }
  });
  fcTagInp.addEventListener("blur", () => setTimeout(() => { const v=fcTagInp.value.trim().replace(/,$/,""); if(v) addFcTag(v); closeFcSug(); }, 150));

  function renderFcSug(tags) {
    if (!tags.length) { closeFcSug(); return; }
    tagSugSel = -1;
    fcTagSug.innerHTML = tags.map(t => `<div class="fb-sug-item" onmousedown="addFcTag('${escHtml(t)}')">${escHtml(t)}</div>`).join("");
    fcTagSug.classList.add("open");
  }
  function closeFcSug() { fcTagSug.classList.remove("open"); fcTagSug.innerHTML = ""; tagSugSel = -1; }
  function addFcTag(tag) {
    tag = tag.trim().toLowerCase();
    if (!tag || createTags.includes(tag)) { fcTagInp.value=""; closeFcSug(); return; }
    createTags.push(tag); renderFcChips(); fcTagInp.value=""; closeFcSug();
  }
  function removeFcTag(tag) { createTags = createTags.filter(t=>t!==tag); renderFcChips(); }
  function renderFcChips() {
    const wrap = document.getElementById("fc-chips");
    wrap.querySelectorAll(".fb-chip").forEach(el=>el.remove());
    createTags.forEach(tag => {
      const c = document.createElement("span"); c.className="fb-chip";
      c.innerHTML = `${escHtml(tag)}<span class="fb-chip-rm" onclick="removeFcTag('${escHtml(tag)}')">✕</span>`;
      wrap.insertBefore(c, fcTagInp);
    });
  }

  // ── Submit create ────────────────────────────────────────
  async function submitCreate() {
    requireUsername(async () => {
      const type  = document.getElementById("fc-type").value;
      const title = document.getElementById("fc-title").value.trim();
      const desc  = document.getElementById("fc-desc").value.trim();
      const err   = document.getElementById("fb-create-err");

      if (!title) { err.textContent = "タイトルは必須です。"; return; }
      err.textContent = "";

      const body = new URLSearchParams({
        type, title, description: desc,
        username: fbUsername, tags: createTags.join(",")
      });
      const res  = await fetch("/api/feedback/create", { method:"POST", body });
      const data = await res.json();
      if (data.ok) {
        showToast("送信しました！", true);
        document.getElementById("fc-title").value = "";
        document.getElementById("fc-desc").value  = "";
        createTags = []; renderFcChips();
        loadFeed();
      } else {
        err.textContent = data.error;
      }
    });
  }

  // ── Filters ──────────────────────────────────────────────
  function setTypeFilter(btn) {
    document.querySelectorAll(".fb-filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeType = btn.dataset.type;
    loadFeed();
  }
  function filterByTag(tag) {
    activeTag = tag;
    document.getElementById("fb-tag-label").textContent = "#" + tag;
    document.getElementById("fb-tag-active").classList.add("visible");
    loadFeed();
  }
  function clearTagFilter() {
    activeTag = "";
    document.getElementById("fb-tag-active").classList.remove("visible");
    loadFeed();
  }
  function debounce() {
    clearTimeout(debTimer);
    debTimer = setTimeout(loadFeed, 300);
  }

  // ── Load feed ─────────────────────────────────────────────
  async function loadFeed() {
    document.getElementById("fb-loading").style.display = "block";
    document.getElementById("fb-empty").style.display   = "none";
    document.querySelectorAll(".fb-card").forEach(el=>el.remove());

    const q   = document.getElementById("fb-search").value.trim();
    let url   = `/api/feedback/search?q=${encodeURIComponent(q)}`;
    if (activeType) url += `&type=${activeType}`;
    if (activeTag)  url += `&tag=${encodeURIComponent(activeTag)}`;

    const res  = await fetch(url);
    const data = await res.json();
    document.getElementById("fb-loading").style.display = "none";

    if (!data.results.length) { document.getElementById("fb-empty").style.display="block"; return; }
    data.results.forEach(item => {
      document.getElementById("fb-list").appendChild(makeCard(item));
    });
  }

  // ── Build card ────────────────────────────────────────────
  function makeCard(item) {
    const card = document.createElement("div");
    card.className = "fb-card" + (item.status==="resolved" ? " resolved" : "");
    card.id = "fb-card-" + item.id;

    const typeLabel = { bug:"🐛 バグ", feature:"✨ 機能要望", other:"📋 その他" }[item.type] || item.type;
    const tags = (item.tags||[]).map(t =>
      `<span class="fb-tag-pill" onclick="filterByTag('${escHtml(t)}')">#${escHtml(t)}</span>`
    ).join(" ");

    card.innerHTML = `
      <div class="fb-card-header" onclick="toggleReplies(${item.id})">
        <span class="type-badge ${item.type}">${typeLabel}</span>
        <div class="fb-card-body">
          <div class="fb-title">${escHtml(item.title)}</div>
          ${item.description ? `<div class="fb-desc">${escHtml(item.description)}</div>` : ""}
          <div class="fb-meta">
            <span class="fb-username">@${escHtml(item.username)}</span>
            <span class="fb-time">${escHtml(item.time_str)}</span>
            ${item.status==="resolved" ? `<span class="resolved-badge">✓ 解決済み</span>` : ""}
            ${tags}
            <span style="margin-left:auto; font-size:.65rem; color:var(--text-dim)">
              ${item.reply_count} ${item.reply_count===1?"返信":"返信"} · クリックで展開
            </span>
          </div>
        </div>
        <button class="fb-star-btn ${item.viewer_starred?"starred":""}" id="star-${item.id}"
                onclick="toggleStar(event, ${item.id})">
          <span class="star-icon">${item.viewer_starred?"★":"☆"}</span>
          <span id="star-count-${item.id}">${item.stars}</span>
        </button>
      </div>

      <div class="fb-replies-wrap" id="replies-wrap-${item.id}">
        <div class="fb-reply-list" id="reply-list-${item.id}">
          <div style="font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);padding:8px 0;">返信を読み込み中…</div>
        </div>

        ${item.status==="resolved" && item.resolved_note ?
          `<div class="fb-resolved-note">✓ 解決済み (<strong>${escHtml(item.resolved_by)}</strong>): ${escHtml(item.resolved_note)}</div>`
          : ""}

        <!-- DEV resolve (injected by JS if is_dev) -->
        <div class="fb-resolve-wrap" id="resolve-wrap-${item.id}" style="display:none">
          <input class="fb-resolve-input" id="resolve-note-${item.id}" placeholder="解決メモ（任意）…" />
          <button class="fb-resolve-btn" onclick="resolveItem(${item.id})">✓ 解決済みにする</button>
        </div>

        <div class="fb-reply-form" id="reply-form-${item.id}">
          <textarea id="reply-text-${item.id}" placeholder="返信を入力…" rows="2"></textarea>
          <div class="fb-reply-row">
            <button class="fb-reply-btn" onclick="submitReply(${item.id})">返信</button>
            <span class="fb-reply-err" id="reply-err-${item.id}"></span>
          </div>
        </div>
      </div>
    `;

    return card;
  }

  // ── Toggle replies ────────────────────────────────────────
  const loadedReplies = new Set();

  async function toggleReplies(fbId) {
    const wrap = document.getElementById(`replies-wrap-${fbId}`);
    const isOpen = wrap.classList.contains("open");
    if (isOpen) { wrap.classList.remove("open"); return; }
    wrap.classList.add("open");

    // Show DEV resolve section if applicable
    const resWrap = document.getElementById(`resolve-wrap-${fbId}`);
    if (resWrap) {
      // Ask server-side via a tiny check: if the page has dev cookie, show
      // We detect via a data attribute set at page render — use session endpoint
      if (window._isDev) resWrap.style.display = "flex";
    }

    if (!loadedReplies.has(fbId)) {
      loadedReplies.add(fbId);
      await fetchReplies(fbId);
    }
  }

  async function fetchReplies(fbId) {
    const res  = await fetch(`/api/feedback/${fbId}/replies`);
    const data = await res.json();
    renderReplies(fbId, data.replies);
  }

  function renderReplies(fbId, replies) {
    const list = document.getElementById(`reply-list-${fbId}`);
    list.innerHTML = "";
    if (!replies.length) {
      list.innerHTML = `<div style="font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);padding:8px 0;">返信はまだありません。</div>`;
      return;
    }
    replies.forEach(r => {
      const d = document.createElement("div");
      d.className = "fb-reply" + (r.is_dev ? " dev-reply" : "");
      d.innerHTML = `
        <div class="fb-reply-header">
          ${r.is_dev ? `<span class="fb-reply-crown" title="開発者">👑</span>` : ""}
          <span class="fb-reply-user">${escHtml(r.username)}</span>
          <span class="fb-reply-time">${escHtml(r.time_str)}</span>
        </div>
        <div class="fb-reply-body">${escHtml(r.content)}</div>
      `;
      list.appendChild(d);
    });
  }

  // ── Submit reply ──────────────────────────────────────────
  async function submitReply(fbId) {
    requireUsername(async () => {
      const content = document.getElementById(`reply-text-${fbId}`).value.trim();
      const errEl   = document.getElementById(`reply-err-${fbId}`);
      if (!content) { errEl.textContent = "返信内容を入力してください。"; return; }
      errEl.textContent = "";

      const body = new URLSearchParams({ username: fbUsername, content });
      const res  = await fetch(`/api/feedback/${fbId}/reply`, { method:"POST", body });
      const data = await res.json();

      if (data.ok) {
        document.getElementById(`reply-text-${fbId}`).value = "";
        // Refresh replies
        loadedReplies.delete(fbId);
        await fetchReplies(fbId);
        showToast("返信を投稿しました。", true);
        // Update reply count on card header
        const meta = document.querySelector(`#fb-card-${fbId} .fb-meta span:last-of-type`);
        // Re-count from the list
        const cnt = document.getElementById(`reply-list-${fbId}`).querySelectorAll(".fb-reply").length;
        if (meta) meta.textContent = `${cnt} ${cnt===1?"返信":"返信"} · クリックで閉じる`;
      } else {
        errEl.textContent = data.error;
      }
    });
  }

  // ── Star toggle ───────────────────────────────────────────
  async function toggleStar(e, fbId) {
    e.stopPropagation();
    const res  = await fetch(`/api/feedback/${fbId}/star`, { method:"POST" });
    const data = await res.json();
    if (!data.ok) return;
    const btn   = document.getElementById(`star-${fbId}`);
    const icon  = btn.querySelector(".star-icon");
    const count = document.getElementById(`star-count-${fbId}`);
    btn.classList.toggle("starred", data.starred);
    icon.textContent  = data.starred ? "★" : "☆";
    count.textContent = data.stars;
  }

  // ── DEV resolve ───────────────────────────────────────────
  async function resolveItem(fbId) {
    const note = document.getElementById(`resolve-note-${fbId}`)?.value.trim() || "";
    const res  = await fetch(`/api/feedback/${fbId}/resolve`, {
      method:"POST", body: new URLSearchParams({ note })
    });
    const data = await res.json();
    if (data.ok) {
      showToast("解決済みとしてマークしました。", true);
      loadFeed();
    } else {
      showToast(data.error, false);
    }
  }

  // ── Toast ─────────────────────────────────────────────────
  function showToast(msg, ok) {
    const el = document.getElementById("fb-toast");
    el.textContent = msg; el.className = "show " + (ok ? "ok" : "err");
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ok ? "ok" : "err"; }, 3000);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── DEV detection — ask the server once ──────────────────
  window._isDev = false;
    fetch("/admin/is_dev_session").then(r=>r.json()).then(d=>{ window._isDev = !!d.is_dev; }).catch(()=>{});

    // Always prompt username on page load
    document.getElementById("un-modal").classList.add("open");
    setTimeout(() => document.getElementById("un-input").focus(), 100);

    loadFeed();

</script>
{% endblock %}
