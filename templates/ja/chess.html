/* ══════════════════════════════════════════════
   CHESS — FULL SCREEN STANDALONE
   Theme: Warm Ivory / Walnut / Amber Gold
   ══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-family:'Syne',sans-serif;
  background:#1a1208;color:#f5edd6;}

/* ── CSS VARS ───────────────────────────────── */
:root{
  --ivory:   #f5edd6;
  --cream:   #ede0c4;
  --parchment:#d4b896;
  --walnut:  #5c3d1e;
  --walnut-dark:#3a2410;
  --amber:   #d4a017;
  --amber-glow:rgba(212,160,23,.4);
  --amber-dim: rgba(212,160,23,.1);
  --copper:  #b87333;
  --light-sq:#f0d9b5;
  --dark-sq: #b58863;
  --light-sq-sel:#f6f669;
  --dark-sq-sel: #cdd26a;
  --move-dot: rgba(20,85,30,.55);
  --red:     #c0392b;
  --green:   #27ae60;
  --bg-panel:rgba(26,18,8,.92);
  --bg-card: rgba(42,28,12,.85);
  --border:  rgba(212,160,23,.2);
  --border-hi:rgba(212,160,23,.45);
  --r:8px; --r-lg:16px;
  --shadow: 0 4px 24px rgba(0,0,0,.5);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.65);
  --trans:.22s cubic-bezier(.34,1.1,.64,1);
}

/* ── TOPBAR ─────────────────────────────────── */
#chess-topbar{
  height:52px;flex-shrink:0;z-index:20;
  background:rgba(26,18,8,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;padding:0 20px;gap:14px;
  position:relative;
}
#chess-topbar::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
  animation:shimmer 4s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:1}}
.topbar-brand{
  font-family:'Playfair Display',serif;
  font-size:1.15rem;font-weight:900;letter-spacing:.08em;
  color:var(--amber);text-shadow:0 0 20px var(--amber-glow);
}
.topbar-back{
  font-family:'Share Tech Mono',monospace;font-size:.62rem;
  color:rgba(245,237,214,.35);text-decoration:none;
  padding:5px 12px;border:1px solid rgba(212,160,23,.2);border-radius:6px;
  transition:all .15s;display:flex;align-items:center;gap:5px;letter-spacing:.06em;
}
.topbar-back:hover{color:var(--ivory);border-color:var(--amber-glow);background:var(--amber-dim);}
.topbar-back svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
#topbar-player{
  margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:.7rem;
  color:var(--parchment);letter-spacing:.08em;
}

/* ── VIEWS ──────────────────────────────────── */
.chess-view{display:none;flex:1;min-height:0;width:100%;overflow:hidden;flex-direction:column;}
.chess-view.active{display:flex;}

/* ══════════════════════════════════════════════
   USERNAME OVERLAY
   ══════════════════════════════════════════════ */
#un-overlay{
  position:fixed;inset:0;z-index:900;
  background:rgba(10,6,2,.95);backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
}
.un-box{
  background:linear-gradient(145deg,#1e1408,#2c1e0e);
  border:1px solid var(--border-hi);border-radius:var(--r-lg);
  padding:44px 48px;width:380px;max-width:94vw;text-align:center;
  box-shadow:var(--shadow-lg),0 0 60px rgba(212,160,23,.1);
  animation:board-enter .45s cubic-bezier(.34,1.4,.64,1) both;
}
.un-king{font-size:5rem;line-height:1;margin-bottom:12px;
  filter:drop-shadow(0 0 20px rgba(212,160,23,.6));
  animation:king-float 3s ease-in-out infinite;}
@keyframes king-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.un-title{
  font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;
  color:var(--amber);letter-spacing:.05em;line-height:1;margin-bottom:6px;
  text-shadow:0 0 30px var(--amber-glow);
}
.un-sub{font-family:'Share Tech Mono',monospace;font-size:.58rem;
  color:rgba(212,160,23,.4);letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px;}
.un-input{
  width:100%;padding:12px 16px;background:rgba(245,237,214,.05);
  border:1px solid var(--border);border-radius:var(--r);
  color:var(--ivory);font-family:'Share Tech Mono',monospace;font-size:.9rem;
  text-align:center;outline:none;transition:all .18s;margin-bottom:14px;
  letter-spacing:.06em;
}
.un-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim);}
.un-input::placeholder{color:rgba(245,237,214,.2);}
.un-btn{
  width:100%;padding:12px;border-radius:var(--r);border:none;
  background:linear-gradient(135deg,var(--amber),var(--copper));
  color:var(--walnut-dark);font-family:'Share Tech Mono',monospace;
  font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 0 24px var(--amber-glow);transition:all .15s;
}
.un-btn:hover{box-shadow:0 0 40px rgba(212,160,23,.6);transform:translateY(-1px);}
.un-err{color:#e07060;font-family:'Share Tech Mono',monospace;font-size:.72rem;min-height:18px;margin-top:6px;}

/* ══════════════════════════════════════════════
   LOBBY VIEW — wood-panelled hall
   ══════════════════════════════════════════════ */
#view-lobby{
  overflow-y:auto;align-items:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(92,61,30,.3) 0%,transparent 60%);
}
/* Decorative board pattern background */
#view-lobby::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(45deg,rgba(212,160,23,.025) 25%,transparent 25%),
    linear-gradient(-45deg,rgba(212,160,23,.025) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,rgba(212,160,23,.025) 75%),
    linear-gradient(-45deg,transparent 75%,rgba(212,160,23,.025) 75%);
  background-size:80px 80px;
  background-position:0 0,0 40px,40px -40px,-40px 0;
}
.lobby-inner{
  position:relative;z-index:1;
  width:100%;max-width:880px;padding:28px 24px;
  display:flex;flex-direction:column;gap:24px;
}
.lobby-hero{
  display:flex;align-items:center;gap:18px;padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.lobby-hero-icon{
  font-size:4rem;line-height:1;
  filter:drop-shadow(0 0 16px rgba(212,160,23,.5));
  animation:king-float 3s ease-in-out infinite;
}
.lobby-hero h1{
  font-family:'Playfair Display',serif;
  font-size:2.2rem;font-weight:900;color:var(--amber);
  text-shadow:0 0 20px var(--amber-glow);
}
.lobby-hero p{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--parchment);margin-top:4px;opacity:.6;}

/* Lobby columns */
.lobby-cols{display:flex;gap:18px;flex-wrap:wrap;}
.lobby-col{
  flex:1;min-width:260px;
  background:linear-gradient(145deg,rgba(42,28,12,.8),rgba(26,18,8,.9));
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow);
}
.col-title{
  font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;
  color:var(--amber);margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

/* Time controls */
.tc-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tc-btn{
  flex:1;min-width:80px;padding:10px 8px;
  background:rgba(245,237,214,.04);
  border:1px solid var(--border);border-radius:var(--r);
  cursor:pointer;text-align:center;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tc-btn:hover{border-color:var(--amber);background:var(--amber-dim);}
.tc-btn.active{
  border-color:var(--amber);background:var(--amber-dim);
  box-shadow:0 0 14px var(--amber-glow);
}
.tc-icon{font-size:1.1rem;}
.tc-name{font-family:'Share Tech Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--parchment);}
.tc-time{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--amber);}

/* Difficulty row */
.diff-row{display:flex;gap:7px;margin-bottom:12px;}
.diff-btn{
  flex:1;padding:8px;background:rgba(245,237,214,.04);
  border:1px solid var(--border);border-radius:var(--r);
  font-family:'Share Tech Mono',monospace;font-size:.72rem;
  color:rgba(245,237,214,.5);cursor:pointer;text-align:center;transition:all .12s;
}
.diff-btn:hover{border-color:var(--amber);color:var(--ivory);}
.diff-btn.active{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}

/* Color selector */
.color-row{display:flex;gap:7px;margin-bottom:14px;}
.color-btn{
  flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--r);
  font-size:1.2rem;cursor:pointer;text-align:center;transition:all .15s;
  background:rgba(245,237,214,.04);
}
.color-btn:hover{border-color:var(--amber);background:var(--amber-dim);}
.color-btn.active{border-color:var(--amber);background:var(--amber-dim);box-shadow:0 0 12px var(--amber-glow);}

/* Action button */
.action-btn{
  width:100%;padding:11px;border-radius:var(--r);border:none;
  background:linear-gradient(135deg,var(--amber),var(--copper));
  color:var(--walnut-dark);font-family:'Share Tech Mono',monospace;
  font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 0 16px var(--amber-glow);transition:all .15s;
  margin-top:4px;
}
.action-btn:hover{box-shadow:0 0 28px rgba(212,160,23,.6);transform:translateY(-1px);}
.action-btn.secondary{
  background:transparent;border:1px solid var(--border-hi);color:var(--amber);
  box-shadow:none;
}
.action-btn.secondary:hover{background:var(--amber-dim);box-shadow:none;transform:none;}

/* Players list */
#players-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.player-row{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:rgba(245,237,214,.04);border:1px solid var(--border);border-radius:var(--r);
  transition:all .12s;
}
.player-row:hover{border-color:var(--border-hi);}
.pr-name{flex:1;font-size:.85rem;color:var(--ivory);}
.challenge-btn{
  padding:5px 14px;background:transparent;border:1px solid var(--border-hi);
  border-radius:var(--r);color:var(--amber);font-family:'Share Tech Mono',monospace;
  font-size:.65rem;cursor:pointer;transition:all .12s;
}
.challenge-btn:hover{background:var(--amber);color:var(--walnut-dark);box-shadow:0 0 12px var(--amber-glow);}
.no-players{
  font-family:'Share Tech Mono',monospace;font-size:.75rem;color:rgba(245,237,214,.3);
  text-align:center;padding:24px 0;
}

/* ══════════════════════════════════════════════
   QUEUE VIEW
   ══════════════════════════════════════════════ */
#view-queue{align-items:center;justify-content:center;background:transparent;}
.queue-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;}
.queue-piece{
  font-size:5rem;line-height:1;
  filter:drop-shadow(0 0 24px rgba(212,160,23,.7));
  animation:piece-orbit 3s ease-in-out infinite;
}
@keyframes piece-orbit{
  0%  {transform:translateY(0)   rotate(-8deg)  scale(1);}
  33% {transform:translateY(-14px) rotate(4deg)  scale(1.05);}
  66% {transform:translateY(6px)  rotate(-3deg) scale(.97);}
  100%{transform:translateY(0)   rotate(-8deg)  scale(1);}
}
.queue-txt{
  font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--amber);
  text-shadow:0 0 16px var(--amber-glow);
}
.queue-sub{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--parchment);opacity:.55;}
.cancel-btn{
  padding:9px 26px;background:transparent;border:1px solid rgba(245,237,214,.2);
  border-radius:var(--r);color:rgba(245,237,214,.45);font-family:'Share Tech Mono',monospace;
  font-size:.75rem;cursor:pointer;transition:all .12s;
}
.cancel-btn:hover{border-color:#c0392b;color:#c0392b;}

/* Spinner ring */
.queue-ring{
  width:70px;height:70px;border-radius:50%;
  border:3px solid rgba(212,160,23,.1);
  border-top-color:var(--amber);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════
   GAME VIEW
   ══════════════════════════════════════════════ */
#view-game{
  flex-direction:row !important;
  background:radial-gradient(ellipse at 30% 50%,rgba(92,61,30,.15) 0%,transparent 60%);
}

/* ── Board column ──────────────────────────── */
.board-col{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 24px;gap:8px;
  flex:1;  /* takes all remaining space so board is naturally centered */
}

/* Player bars */
.player-bar{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:6px 4px;gap:10px;
}
.pb-left{display:flex;align-items:center;gap:9px;}
.pb-piece{font-size:1.5rem;line-height:1;filter:drop-shadow(0 0 6px rgba(212,160,23,.4));}
.pb-name{font-family:'Syne',sans-serif;font-size:.92rem;font-weight:700;color:var(--ivory);}
.pb-tag{
  font-family:'Share Tech Mono',monospace;font-size:.58rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--parchment);opacity:.5;
  padding:1px 7px;border:1px solid var(--border);border-radius:20px;
}
.pb-tag.turn{color:var(--amber);border-color:var(--amber);opacity:1;
  animation:tag-glow 1.2s ease-in-out infinite;}
@keyframes tag-glow{0%,100%{box-shadow:0 0 6px var(--amber-glow)}50%{box-shadow:0 0 16px var(--amber-glow)}}

/* Chess clock */
.chess-clock{
  font-family:'Share Tech Mono',monospace;font-size:1.5rem;font-weight:700;
  color:rgba(245,237,214,.3);background:rgba(26,18,8,.7);
  border:1px solid var(--border);border-radius:var(--r);
  padding:7px 15px;min-width:96px;text-align:center;
  transition:all .3s;letter-spacing:.04em;
}
.chess-clock.active{
  color:var(--ivory);border-color:var(--border-hi);background:rgba(42,28,12,.85);
  box-shadow:0 0 12px rgba(212,160,23,.15);
}
.chess-clock.low {color:var(--amber);border-color:var(--amber);}
.chess-clock.crit{
  color:#e74c3c;border-color:#e74c3c;
  animation:clock-crit .7s ease-in-out infinite;
}
@keyframes clock-crit{0%,100%{box-shadow:0 0 8px rgba(231,76,60,.3)}50%{box-shadow:0 0 20px rgba(231,76,60,.7)}}

/* ── The board ─────────────────────────────── */
:root{--sq:min(76px, calc((100vh - 200px) / 8));}
.board-wrap{position:relative;}
#chess-board{
  display:grid;
  grid-template-columns:repeat(8,var(--sq));
  grid-template-rows:   repeat(8,var(--sq));
  border:3px solid var(--walnut);
  border-radius:4px;
  box-shadow:
    0 0 0 1px rgba(212,160,23,.3),
    var(--shadow-lg),
    0 0 60px rgba(92,61,30,.3);
  overflow:hidden;
  animation:board-enter .6s cubic-bezier(.34,1.2,.64,1) both;
}
@keyframes board-enter{
  from{transform:scale(.88) rotateX(8deg);opacity:0;filter:blur(8px);}
  to  {transform:scale(1)   rotateX(0deg);opacity:1;filter:none;}
}

.sq{
  width:var(--sq);height:var(--sq);
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .08s;
}
.sq.light{background:var(--light-sq);}
.sq.dark {background:var(--dark-sq);}
.sq.selected{background:var(--light-sq-sel) !important;}
.sq.last-from,.sq.last-to{background:rgba(155,199,0,.45) !important;}
.sq.in-check{background:rgba(200,0,0,.6) !important;animation:check-flash .4s ease;}
@keyframes check-flash{0%,100%{background:rgba(200,0,0,.6)}50%{background:rgba(255,80,80,.8)}}
.sq:hover{filter:brightness(1.08);}

/* Coordinate labels */
.coord{
  position:absolute;font-family:'Share Tech Mono',monospace;
  font-size:calc(var(--sq)*.18);font-weight:700;
  line-height:1;pointer-events:none;z-index:1;
}
.coord.rank{left:2px;top:2px;}
.coord.file{right:2px;bottom:2px;}
.sq.light .coord{color:var(--dark-sq);}
.sq.dark  .coord{color:var(--light-sq);}

/* Pieces */
.piece{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--sq)*.78);line-height:1;pointer-events:none;z-index:2;
  font-family:"Segoe UI Symbol","Apple Color Emoji","Noto Sans Symbols",sans-serif;
  transition:transform .12s cubic-bezier(.34,1.4,.64,1);
  will-change:transform;
}
.piece.wp{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 1px rgba(0,0,0,1);}
.piece.bp{color:#1a0d00;text-shadow:0 1px 2px rgba(255,255,255,.2);}
.sq:hover .piece{transform:scale(1.06);}
.piece-enter{animation:piece-land .25s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes piece-land{from{transform:scale(.4) translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.piece-capture{animation:piece-pop .15s ease-out both;}
@keyframes piece-pop{from{transform:scale(1.3)}to{transform:scale(1)}}

/* Move dots and capture rings */
.move-dot{
  position:absolute;width:32%;height:32%;border-radius:50%;
  background:rgba(20,85,30,.55);z-index:3;pointer-events:none;
  animation:dot-in .15s ease both;
}
@keyframes dot-in{from{transform:scale(0)}to{transform:scale(1)}}
.capture-ring{
  position:absolute;inset:3%;border-radius:50%;
  border:calc(var(--sq)*.1) solid rgba(20,85,30,.55);
  z-index:3;pointer-events:none;
  animation:dot-in .15s ease both;
}

/* ── Info panel ────────────────────────────── */
.info-panel{
  display:flex;flex-direction:column;
  width:200px;flex-shrink:0;min-height:0;
  background:linear-gradient(145deg,rgba(26,18,8,.95),rgba(42,28,12,.9));
  border-left:1px solid var(--border);padding:12px;
  overflow:hidden;
}
.ip-section-title{
  font-family:'Share Tech Mono',monospace;font-size:.58rem;
  text-transform:uppercase;letter-spacing:.16em;color:var(--parchment);opacity:.45;
  margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border);
}
.move-list{
  flex:1;overflow-y:auto;min-height:0;
  font-family:'Share Tech Mono',monospace;font-size:.78rem;
  display:flex;flex-direction:column;gap:1px;margin-bottom:14px;
}
.move-list::-webkit-scrollbar{width:3px;}
.move-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ml-pair{
  display:grid;grid-template-columns:26px 1fr 1fr;
  gap:4px;padding:3px 4px;border-radius:3px;transition:background .1s;
}
.ml-pair:hover{background:rgba(212,160,23,.07);}
.ml-num {color:var(--parchment);font-size:.68rem;text-align:right;padding-top:1px;opacity:.5;}
.ml-move{color:var(--ivory);padding:1px 6px;border-radius:2px;cursor:pointer;transition:background .1s;}
.ml-move:hover{background:rgba(212,160,23,.12);}
.ml-move.last{background:rgba(212,160,23,.18);color:var(--amber);}

/* Game controls */
.game-ctrls{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.ctrl-btn{
  padding:8px 12px;background:transparent;border:1px solid var(--border);
  border-radius:var(--r);color:rgba(245,237,214,.4);font-family:'Share Tech Mono',monospace;
  font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
  transition:all .12s;text-align:left;
}
.ctrl-btn:hover{border-color:var(--border-hi);color:var(--ivory);}
.ctrl-btn.danger:hover{border-color:#e74c3c;color:#e74c3c;background:rgba(231,76,60,.08);}
.ctrl-btn.offer:hover{border-color:var(--green);color:var(--green);background:rgba(39,174,96,.08);}
.ctrl-btn:disabled{opacity:.2;pointer-events:none;}

/* Draw offer bar */
.draw-bar{
  display:none;background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.35);
  border-radius:var(--r);padding:10px 12px;margin-bottom:8px;
  font-family:'Share Tech Mono',monospace;font-size:.72rem;
}
.draw-bar.open{display:block;}
.draw-bar p{color:var(--green);margin-bottom:8px;}
.draw-btns{display:flex;gap:6px;}
.da-accept {flex:1;padding:6px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:'Share Tech Mono',monospace;font-size:.68rem;cursor:pointer;}
.da-decline{flex:1;padding:6px;background:transparent;border:1px solid var(--border);color:rgba(245,237,214,.4);border-radius:var(--r);font-family:'Share Tech Mono',monospace;font-size:.68rem;cursor:pointer;}
.da-decline:hover{border-color:#e74c3c;color:#e74c3c;}

/* Turn banner */
#turn-banner{
  padding:8px 12px;border-radius:var(--r);border:1px solid var(--border);
  font-family:'Share Tech Mono',monospace;font-size:.72rem;text-align:center;
  margin-bottom:10px;transition:all .4s;background:rgba(26,18,8,.5);
  color:rgba(245,237,214,.4);letter-spacing:.06em;
}
#turn-banner.my-turn{
  border-color:var(--amber);color:var(--amber);background:var(--amber-dim);
  box-shadow:0 0 14px var(--amber-glow);
  animation:turn-pulse 1.3s ease-in-out infinite;
}
#turn-banner.my-turn::before{content:'✦ ';}
#turn-banner.my-turn::after {content:' ✦';}
@keyframes turn-pulse{0%,100%{box-shadow:0 0 14px var(--amber-glow)}50%{box-shadow:0 0 28px rgba(212,160,23,.65)}}

/* ══════════════════════════════════════════════
   GAME OVER OVERLAY
   ══════════════════════════════════════════════ */
#game-over{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(10,6,2,.88);backdrop-filter:blur(12px);
  align-items:center;justify-content:center;
}
#game-over.open{display:flex;}
.go-box{
  background:linear-gradient(145deg,#1e1408,#2c1e0e);
  border:1px solid var(--border-hi);border-radius:var(--r-lg);
  padding:44px;max-width:420px;width:92%;text-align:center;
  box-shadow:var(--shadow-lg),0 0 60px rgba(212,160,23,.1);
  animation:board-enter .4s cubic-bezier(.34,1.4,.64,1) both;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.go-icon{font-size:4rem;filter:drop-shadow(0 0 20px rgba(212,160,23,.6));}
.go-result{
  font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;
  color:var(--amber);text-shadow:0 0 20px var(--amber-glow);
}
.go-reason{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:var(--parchment);opacity:.6;}
.go-detail{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--parchment);opacity:.4;}
.go-again{
  margin-top:6px;padding:12px 32px;border-radius:var(--r);border:none;
  background:linear-gradient(135deg,var(--amber),var(--copper));
  color:var(--walnut-dark);font-family:'Share Tech Mono',monospace;
  font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 0 20px var(--amber-glow);transition:all .15s;
}
.go-again:hover{box-shadow:0 0 32px rgba(212,160,23,.6);transform:translateY(-1px);}

/* ══════════════════════════════════════════════
   CHALLENGE TOAST
   ══════════════════════════════════════════════ */
#challenge-toast{
  position:fixed;top:20px;right:20px;z-index:400;
  background:linear-gradient(145deg,#1e1408,#2c1e0e);
  border:1px solid var(--border-hi);border-radius:var(--r);
  padding:16px 20px;min-width:270px;
  box-shadow:var(--shadow),0 0 30px rgba(212,160,23,.15);
  display:none;flex-direction:column;gap:10px;
  animation:slide-in .3s cubic-bezier(.34,1.2,.64,1) both;
}
@keyframes slide-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#challenge-toast.open{display:flex;}
.ct-title{font-family:'Share Tech Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);}
.ct-name {font-size:.95rem;font-weight:700;color:var(--ivory);}
.ct-tc   {font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--parchment);opacity:.55;}
.ct-btns {display:flex;gap:8px;}
.ct-accept {flex:1;padding:7px;background:linear-gradient(135deg,var(--amber),var(--copper));color:var(--walnut-dark);border:none;border-radius:var(--r);font-family:'Share Tech Mono',monospace;font-size:.72rem;font-weight:700;cursor:pointer;}
.ct-decline{flex:1;padding:7px;background:transparent;border:1px solid var(--border);color:rgba(245,237,214,.4);border-radius:var(--r);font-family:'Share Tech Mono',monospace;font-size:.72rem;cursor:pointer;}
.ct-decline:hover{border-color:#e74c3c;color:#e74c3c;}

/* ── Promotion picker ──────────────────────── */
#promo-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,6,2,.85);
  backdrop-filter:blur(8px);z-index:600;align-items:center;justify-content:center;
}
#promo-overlay.open{display:flex;}
.promo-box{
  background:linear-gradient(145deg,#1e1408,#2c1e0e);
  border:1px solid var(--border-hi);border-radius:var(--r);
  padding:22px 26px;text-align:center;
  box-shadow:var(--shadow-lg);
}
.promo-label{font-family:'Share Tech Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--parchment);opacity:.55;margin-bottom:14px;}
.promo-pieces{display:flex;gap:10px;}
.promo-btn{
  width:68px;height:68px;background:rgba(245,237,214,.06);
  border:1px solid var(--border-hi);border-radius:var(--r);
  font-size:2.5rem;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.promo-btn:hover{border-color:var(--amber);background:var(--amber-dim);transform:scale(1.1);box-shadow:0 0 16px var(--amber-glow);}

/* ── Toast ──────────────────────────────────── */
#chess-toast{
  position:fixed;bottom:22px;right:22px;z-index:700;pointer-events:none;
  background:rgba(26,18,8,.96);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 18px;
  font-family:'Share Tech Mono',monospace;font-size:.76rem;
  opacity:0;transform:translateY(8px);transition:all .22s;
  backdrop-filter:blur(8px);color:var(--ivory);
}
#chess-toast.show{opacity:1;transform:none;}
#chess-toast.ok  {border-color:rgba(39,174,96,.5);color:#27ae60;}
#chess-toast.err {border-color:rgba(192,57,43,.5);color:#e74c3c;}
#chess-toast.info{border-color:var(--border-hi);color:var(--amber);}
</style>
</head>

    LANHub

<!-- ── PROMO OVERLAY ─────────────────── -->
<div id="promo-overlay">

    <div class="promo-pieces" id="promo-pieces"></div>

</div>

<!-- ── GAME OVER ─────────────────────── -->
<div id="game-over">
  <div class="go-box">
    <div class="go-icon"   id="go-icon">🏆</div>
    <div class="go-result" id="go-result">あなたの勝ち！</div>
    <div class="go-reason" id="go-reason">チェックメイト</div>
    <div class="go-detail" id="go-detail"></div>
    <button class="go-again" onclick="backToLobby()">もう一度プレイ</button>
  </div>
</div>

<!-- ── TOAST ─────────────────────────── -->
<div id="chess-toast"></div>

<!-- ══════════ LOBBY ═══════════════════ -->
<div id="view-lobby" class="chess-view active">
  <div class="lobby-inner">
    <div class="lobby-hero">
      <div class="lobby-hero-icon">♟</div>
      <div>
        <h1>チェス</h1>
        <p>ようこそ、<strong id="lobby-username" style="color:var(--amber)"></strong></p>
      </div>
    </div>

    <!-- Time control row (shared) -->
    <div class="tc-row" id="tc-row-main">
      <button class="tc-btn" data-tc="bullet"    onclick="selectTC(this)"><span class="tc-icon">⚡</span><span class="tc-name">ブレット</span><span class="tc-time">2+1</span></button>
      <button class="tc-btn active" data-tc="blitz" onclick="selectTC(this)"><span class="tc-icon">🔥</span><span class="tc-name">ブリッツ</span><span class="tc-time">5+3</span></button>
      <button class="tc-btn" data-tc="rapid"     onclick="selectTC(this)"><span class="tc-icon">⏱</span><span class="tc-name">ラピッド</span><span class="tc-time">15+10</span></button>
      <button class="tc-btn" data-tc="classical" onclick="selectTC(this)"><span class="tc-icon">🕰</span><span class="tc-name">クラシカル</span><span class="tc-time">30+0</span></button>
    </div>

    <div class="lobby-cols">

      <!-- vs Bot -->
      <div class="lobby-col">
        <div class="col-title">🤖 vs コンピューター</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--parchment);opacity:.5;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;">難易度</div>
        <div class="diff-row">
          <button class="diff-btn" data-d="easy"   onclick="selectDiff(this)">かんたん</button>
          <button class="diff-btn active" data-d="medium" onclick="selectDiff(this)">ふつう</button>
          <button class="diff-btn" data-d="hard"   onclick="selectDiff(this)">むずかしい</button>
        </div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--parchment);opacity:.5;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;">プレイヤーカラー</div>
        <div class="color-row">
          <button class="color-btn active" data-c="white"  onclick="selectColor(this)">♔ 白</button>
          <button class="color-btn"        data-c="black"  onclick="selectColor(this)">♚ 黒</button>
          <button class="color-btn"        data-c="random" onclick="selectColor(this)">🎲 ランダム</button>

        <button class="action-btn" onclick="startBot()">対コンピューター</button>

      <!-- vs Human -->
      <div class="lobby-col">
        <div class="col-title">⚔ vs 対戦相手</div>
        <div class="diff-row" style="margin-bottom:14px;">
          <button class="action-btn" onclick="queueRandom()" style="font-size:.72rem;">🎲 ランダム対戦</button>
        </div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--parchment);opacity:.5;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;">対戦可能なプレイヤー</div>
        <div id="players-list">

<!-- ══════════ QUEUE ════════════════════ -->
<div id="view-queue" class="chess-view">
  <div class="queue-center">

</div>

<!-- ══════════ GAME ══════════════════════ -->
<div id="view-game" class="chess-view">

  <div class="board-col">
    <!-- Opponent bar -->
    <div class="player-bar">
      <div class="pb-left">
        <span class="pb-piece" id="opp-piece">♚</span>
        <span class="pb-name"  id="opp-name">対戦相手</span>
        <span class="pb-tag"   id="opp-tag">黒</span>
      </div>

      <div id="chess-board"></div>

      <div class="pb-left">
        <span class="pb-piece" id="my-piece">♔</span>
        <span class="pb-name"  id="my-name">あなた</span>
        <span class="pb-tag"   id="my-tag">白</span>

      <div class="draw-btns">

      <button class="ctrl-btn offer"  id="draw-btn"       onclick="offerDraw()">🤝 引き分け提案</button>
      <button class="ctrl-btn offer"  id="claim-draw-btn" onclick="claimDraw()" style="display:none">✋ 引き分け主張</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ── Bootstrap socket ─────────────────────────────────────────
const _socket = io();
_socket.on('connect', () => _socket.emit('page_open', {path: window.location.pathname}));
window.addEventListener('pagehide',     () => _socket.emit('chess_leave_route'));
window.addEventListener('beforeunload', () => _socket.emit('chess_leave_route'));

const socket = _socket;

// ── Piece map ─────────────────────────────────────────────────
const PIECES = {
  'P':'♙','N':'♘','B':'♗','R':'♖','Q':'♕','K':'♔',
  'p':'♟','n':'♞','b':'♝','r':'♜','q':'♛','k':'♚',
};

// ── State ─────────────────────────────────────────────────────
let myUsername    = null;
let currentView   = 'lobby';
let gameState     = null;
let currentGameId = null;
let selectedSq    = null;
let legalDests    = [];
let pendingPromo  = null;
let pendingChallenge = null;
let selectedTC    = 'blitz';
let selectedDiff  = 'medium';
let selectedColor = 'white';
let clockInterval = null;
let clockData     = null;

// ── Username ──────────────────────────────────────────────────
document.getElementById('un-input').addEventListener('keydown', e => { if(e.key==='Enter') submitUsername(); });
document.getElementById('un-submit').addEventListener('click', submitUsername);

function submitUsername() {
  const val = document.getElementById('un-input').value.trim();
  const err = document.getElementById('un-err');
  if (!val)          { err.textContent = 'ユーザー名を入力してください。'; return; }
  if (val.length>24) { err.textContent = '24文字以内で入力してください。'; return; }
  err.textContent = '';
  socket.emit('chess_set_username', {username: val});
}

socket.on('chess_username_ack', data => {
  if (!data.ok) { document.getElementById('un-err').textContent = data.error; return; }
  myUsername = data.username;
  document.getElementById('lobby-username').textContent = myUsername;
  document.getElementById('topbar-player').textContent  = myUsername;
  document.getElementById('un-overlay').style.display   = 'none';
  showView('lobby');
  socket.emit('chess_join_lobby');
});

// ── Views ─────────────────────────────────────────────────────
function showView(v) {
  currentView = v;
  document.querySelectorAll('.chess-view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v)?.classList.add('active');
}

// ── Lobby controls ────────────────────────────────────────────
function selectTC(btn)    { document.querySelectorAll('.tc-btn').forEach(b=>b.classList.remove('active'));   btn.classList.add('active'); selectedTC    = btn.dataset.tc; }
function selectDiff(btn)  { document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); selectedDiff  = btn.dataset.d; }
function selectColor(btn) { document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active'); selectedColor = btn.dataset.c; }

socket.on('chess_lobby_state', data => {
  const list  = document.getElementById('players-list');
  const noEl  = document.getElementById('no-players');
  const others = data.available.filter(p => p.sid !== data.my_sid);
  list.querySelectorAll('.player-row').forEach(el => el.remove());
  if (!others.length) { noEl.style.display = 'block'; return; }
  noEl.style.display = 'none';
  others.forEach(p => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `<span class="pr-name">♟ ${escHtml(p.username)}</span>
      <button class="challenge-btn" onclick="challengePlayer('${p.sid}')">チャレンジ</button>`;
    list.appendChild(row);
  });
});

// ── Bot game ──────────────────────────────────────────────────
function startBot() {
  socket.emit('chess_start_bot', {difficulty: selectedDiff, time_control: selectedTC, color: selectedColor});
}

// ── PvP challenge ─────────────────────────────────────────────
function challengePlayer(sid) {
  socket.emit('chess_challenge', {target_sid: sid, time_control: selectedTC});
}

socket.on('chess_challenged', data => {
  pendingChallenge = {challenger_sid: data.challenger_sid, time_control: data.time_control};
  document.getElementById('ct-name').textContent = `${data.challenger_username} からチャレンジ！`;
  document.getElementById('ct-tc').textContent   = data.tc_label;
  document.getElementById('challenge-toast').classList.add('open');
});

function respondChallenge(accept) {
  document.getElementById('challenge-toast').classList.remove('open');
  if (!pendingChallenge) return;
  socket.emit('chess_challenge_response', {
    challenger_sid: pendingChallenge.challenger_sid,
    accept, time_control: pendingChallenge.time_control,
  });
  pendingChallenge = null;
}

socket.on('chess_challenge_declined', data => { showToast(`${data.by} が拒否しました。`, 'err'); });
socket.on('chess_challenge_sent',     data => { showToast(`${data.target} にチャレンジを送信しました。`, 'info'); });

// ── Queue ─────────────────────────────────────────────────────
function queueRandom() {
  socket.emit('chess_queue_random', {time_control: selectedTC});
}
socket.on('chess_queued', data => {
  document.getElementById('queue-tc-label').textContent = data.tc_label;
  showView('queue');
});
function cancelQueue() { socket.emit('chess_cancel_queue'); }
socket.on('chess_queue_cancelled', () => { showView('lobby'); });

// ── Game start ────────────────────────────────────────────────
socket.on('chess_game_start', data => { startGame(data); });

function startGame(data) {
  gameState     = data;
  currentGameId = data.game_id;
  document.getElementById('game-over').classList.remove('open');
  document.getElementById('draw-bar').classList.remove('open');
  document.getElementById('move-list').innerHTML = '';
  selectedSq = null; legalDests = [];
  showView('game');
  updateGameUI(data);
  startClock(data.white_time, data.black_time, data.turn);
  renderBoard(data);
}

socket.on('chess_game_update', data => {
  gameState = data;
  renderBoard(data);
  updateGameUI(data);
  startClock(data.white_time, data.black_time, data.turn);
});

socket.on('chess_game_over', data => {
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  const myColor = gameState?.player_color;
  let icon, result;
  if (data.result === '1/2-1/2') {
    icon = '🤝'; result = '引き分け！';
  } else if ((data.result === '1-0' && myColor === 'white') ||
             (data.result === '0-1' && myColor === 'black')) {
    icon = '🏆'; result = 'あなたの勝ち！';
  } else if (myColor === 'spectator') {
    icon = '♟'; result = data.result;
  } else {
    icon = '💀'; result = 'あなたの負け。';
  }
  document.getElementById('go-icon').textContent   = icon;
  document.getElementById('go-result').textContent = result;
  document.getElementById('go-reason').textContent = data.reason;
  document.getElementById('go-detail').textContent =
    `${data.white_username} (白) vs ${data.black_username} (黒)`;
  document.getElementById('game-over').classList.add('open');
});

function backToLobby() {
  document.getElementById('game-over').classList.remove('open');
  selectedSq = null; legalDests = [];
  currentGameId = null; gameState = null;
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  socket.emit('chess_join_lobby');
  showView('lobby');
}

// ── Game UI ───────────────────────────────────────────────────
function updateGameUI(data) {
  const myIsWhite = data.player_color === 'white';
  const isMyTurn  = data.turn === data.player_color && !data.is_over;

  document.getElementById('my-piece').textContent  = myIsWhite ? '♔' : '♚';
  document.getElementById('opp-piece').textContent = myIsWhite ? '♚' : '♔';
  document.getElementById('my-name').textContent   = myIsWhite ? data.white_username : data.black_username;
  document.getElementById('opp-name').textContent  = myIsWhite ? data.black_username : data.white_username;

  const myTag  = document.getElementById('my-tag');
  const oppTag = document.getElementById('opp-tag');
  myTag.textContent  = myIsWhite ? '白' : '黒';
  oppTag.textContent = myIsWhite ? '黒' : '白';
  myTag.className  = 'pb-tag' + (isMyTurn  ? ' turn' : '');
  oppTag.className = 'pb-tag' + (!isMyTurn ? ' turn' : '');

  // Turn banner
  const banner = document.getElementById('turn-banner');
  if (data.is_over) {
    banner.textContent = 'ゲーム終了';
    banner.className = 'turn-banner';
  } else if (isMyTurn) {
    banner.textContent = data.waiting_for_promotion ? '昇格を選択' : 'あなたの番です！';
    banner.className = 'turn-banner my-turn';
  } else {
    banner.textContent = `${myIsWhite ? data.black_username : data.white_username} の番…`;
    banner.className = 'turn-banner';
  }

  // Move list
  const ml = document.getElementById('move-list');
  if (data.move_history?.length) {
    ml.innerHTML = '';
    for (let i=0; i<data.move_history.length; i+=2) {
      const pair = document.createElement('div');
      pair.className = 'ml-pair';
      const w = data.move_history[i];
      const b = data.move_history[i+1] || '';
      const isLast = i+1 >= data.move_history.length || (i+2 >= data.move_history.length && b);
      pair.innerHTML =
        `<span class="ml-num">${Math.floor(i/2)+1}</span>` +
        `<span class="ml-move${!b && i+1===data.move_history.length?' last':''}">${w}</span>` +
        `<span class="ml-move${b && isLast?' last':''}">${b}</span>`;
      ml.appendChild(pair);
    }
    ml.scrollTop = ml.scrollHeight;
  }

  // Controls
  const isOver = data.is_over || data.player_color === 'spectator';
  document.getElementById('resign-btn').disabled   = isOver;
  document.getElementById('draw-btn').disabled     = isOver;
  document.getElementById('claim-draw-btn').style.display =
    data.can_claim_draw && !isOver ? 'block' : 'none';
}

// ── Board rendering ───────────────────────────────────────────
function renderBoard(data) {
  const boardEl = document.getElementById('chess-board');
  const isFlipped = data.player_color === 'black';
  boardEl.innerHTML = '';

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const displayRow = isFlipped ? 7-r : r;
      const displayCol = isFlipped ? 7-c : c;
      const rank = 8 - displayRow;
      const file = String.fromCharCode(97 + displayCol);
      const sqName = file + rank;

      const sq = document.createElement('div');
      const isLight = (displayRow + displayCol) % 2 === 0;
      sq.className = 'sq ' + (isLight ? 'light' : 'dark');

      // Highlights
      if (selectedSq === sqName) sq.classList.add('selected');
      const lm = data.last_move;
      if (lm) {
        const lmStr = Array.isArray(lm) ? lm.join('') : String(lm);
        if (lmStr.includes(sqName)) sq.classList.add('last-from');
      }
      if (data.in_check_sq === sqName) sq.classList.add('in-check');

      // Coordinates
      if (displayCol === 0) {
        const coord = document.createElement('span');
        coord.className = 'coord rank';
        coord.textContent = rank;
        sq.appendChild(coord);
      }
      if (displayRow === 7) {
        const coord = document.createElement('span');
        coord.className = 'coord file';
        coord.textContent = file;
        sq.appendChild(coord);
      }

      // Piece
      const piece = data.board[displayRow][displayCol];
      if (piece) {
        const pel = document.createElement('span');
        const isWhitePiece = piece === piece.toUpperCase();
        pel.className = 'piece ' + (isWhitePiece ? 'wp' : 'bp');
        pel.textContent = PIECES[piece] || piece;
        sq.appendChild(pel);
      }

      // Legal move indicators
      if (legalDests.includes(sqName)) {
        const ind = document.createElement('span');
        ind.className = piece ? 'capture-ring' : 'move-dot';
        sq.appendChild(ind);
      }

      sq.addEventListener('click', () => handleSquareClick(sqName, data));
      boardEl.appendChild(sq);
    }
  }
}

// ── Click handling ────────────────────────────────────────────
function handleSquareClick(sqName, data) {
  if (data.is_over) return;
  if (data.turn !== data.player_color) return;

  if (legalDests.includes(sqName) && selectedSq) {
    attemptMove(selectedSq, sqName, data);
    return;
  }

  const {row, col} = parseSquareName(sqName);
  const piece = data.board[row][col];
  if (!piece) { selectedSq = null; legalDests = []; renderBoard(data); return; }

  const isWhitePiece = piece === piece.toUpperCase();
  const isMyPiece = (data.player_color === 'white' && isWhitePiece) ||
                    (data.player_color === 'black' && !isWhitePiece);
  if (!isMyPiece) { selectedSq = null; legalDests = []; renderBoard(data); return; }

  selectedSq = sqName;
  legalDests = data.legal_moves
    .filter(m => m.startsWith(sqName))
    .map(m => m.slice(2, 4));
  renderBoard(data);
}

function attemptMove(from, to, data) {
  const {row, col} = parseSquareName(from, data.player_color === 'black');
  const piece = data.board[row][col];
  const toRank = parseInt(to[1]);
  const isPawn = piece && piece.toLowerCase() === 'p';
  const isPromo = isPawn &&
    ((piece === piece.toUpperCase() && toRank === 8) ||
     (piece === piece.toLowerCase() && toRank === 1));
  selectedSq = null; legalDests = [];
  if (isPromo) {
    pendingPromo = {from, to};
    showPromoDialog(piece === piece.toUpperCase() ? 'white' : 'black');
  } else {
    sendMove(from, to, null);
  }
}

function sendMove(from, to, promo) {
  socket.emit('chess_move', {game_id: currentGameId, from, to, promotion: promo || 'q'});
}

function parseSquareName(sqName) {
  const file = sqName.charCodeAt(0) - 97;
  const rank = parseInt(sqName[1]) - 1;
  return { row: 7 - rank, col: file };
}


// ── Promotion ─────────────────────────────────────────────────
function showPromoDialog(color) {
  const pp = document.getElementById('promo-pieces');
  const pieces = color === 'white'
    ? [['q','♕'],['r','♖'],['b','♗'],['n','♘']]
    : [['q','♛'],['r','♜'],['b','♝'],['n','♞']];
  pp.innerHTML = '';
  pieces.forEach(([code, sym]) => {
    const btn = document.createElement('button');
    btn.className = 'promo-btn'; btn.textContent = sym;
    btn.onclick = () => selectPromo(code);
    pp.appendChild(btn);
  });
  document.getElementById('promo-overlay').classList.add('open');
}
function selectPromo(code) {
  document.getElementById('promo-overlay').classList.remove('open');
  if (pendingPromo) { sendMove(pendingPromo.from, pendingPromo.to, code); pendingPromo = null; }
}

// ── Clock ─────────────────────────────────────────────────────
function startClock(wt, bt, turn) {
  if (clockInterval) clearInterval(clockInterval);
  clockData = {whiteTime: wt, blackTime: bt, turn, startTs: Date.now()};
  tickClock();
  clockInterval = setInterval(tickClock, 100);
}

function tickClock() {
  if (!clockData || !gameState) return;
  const elapsed = (Date.now() - clockData.startTs) / 1000;
  const wt = Math.max(0, clockData.whiteTime - (clockData.turn === 'white' ? elapsed : 0));
  const bt = Math.max(0, clockData.blackTime - (clockData.turn === 'black' ? elapsed : 0));
  const myIsWhite = gameState.player_color === 'white';
  setClockDisplay('my-clock',  myIsWhite ? wt : bt, clockData.turn === gameState.player_color);
  setClockDisplay('opp-clock', myIsWhite ? bt : wt, clockData.turn !== gameState.player_color);
}

function setClockDisplay(id, secs, isActive) {
  const el = document.getElementById(id);
  if (!el) return;
  const mins = Math.floor(secs / 60);
  const frac = secs % 60;
  el.textContent = secs < 10
    ? `0:${frac.toFixed(1).padStart(4,'0')}`
    : `${mins}:${Math.floor(frac).toString().padStart(2,'0')}`;
  el.className = 'chess-clock' +
    (isActive ? ' active' : '') +
    (secs < 30 && secs > 10 ? ' low' : '') +
    (secs <= 10 ? ' crit' : '');
}

// ── Game controls ─────────────────────────────────────────────
function resignGame() {
  if (!confirm('このゲームを投了しますか？')) return;
  socket.emit('chess_resign', {game_id: currentGameId});
}
function offerDraw() {
  socket.emit('chess_offer_draw', {game_id: currentGameId});
  showToast('引き分けを提案しました。', 'info');
}
function claimDraw() { socket.emit('chess_claim_draw', {game_id: currentGameId}); }
function respondDraw(accept) {
  socket.emit('chess_draw_response', {game_id: currentGameId, accept});
  document.getElementById('draw-bar').classList.remove('open');
}

socket.on('chess_draw_offered',  () => { document.getElementById('draw-bar').classList.add('open'); });
socket.on('chess_draw_declined', () => { showToast('引き分けを拒否されました。', 'err'); document.getElementById('draw-bar').classList.remove('open'); });
socket.on('chess_error',          data => { showToast(data.message, 'err'); });

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, type) {
  const el = document.getElementById('chess-toast');
  el.textContent = msg; el.className = 'show ' + (type||'info');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = type||'info'; }, 3500);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
