{% extends "base.html" %}

{% block content %}
<style>
  #chat-wrap   { max-width: 700px; margin: 2rem auto; font-family: sans-serif; }
  #messages    { border: 1px solid #ccc; border-radius: 8px; height: 420px;
                 overflow-y: auto; padding: 12px; background: #fafafa; }
  .msg         { margin: 4px 0; }
  .msg .who    { font-weight: bold; margin-right: 6px; }
  .msg.system  { color: #888; font-style: italic; }
  .msg.self .who { color: #2563eb; }
  #input-row   { display: flex; gap: 8px; margin-top: 10px; }
  #msg-input   { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
  button       { padding: 8px 16px; border-radius: 6px; border: none;
                 background: #2563eb; color: white; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #char-count  { font-size: 0.8em; color: #888; text-align: right; margin-top: 2px; }
  #error-toast { display:none; color:#b91c1c; background:#fee2e2;
                 border:1px solid #fca5a5; padding:8px 12px; border-radius:6px; margin-top:8px; }

  /* Modal */
  #modal-bg    { position:fixed; inset:0; background:rgba(0,0,0,.45);
                 display:flex; align-items:center; justify-content:center; z-index:100; }
  #modal       { background:white; padding:2rem; border-radius:12px;
                 width:320px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  #modal input { width:100%; padding:8px; margin:12px 0; border-radius:6px;
                 border:1px solid #ccc; box-sizing:border-box; }
  #modal-error { color:#b91c1c; font-size:.85em; min-height:1.2em; }
</style>

<!-- Username modal -->
<div id="modal-bg">
  <div id="modal">
    <h2>💬 Join Chat</h2>
    <p>Pick a username for this session.</p>
    <input id="username-input" type="text" maxlength="24" placeholder="Username" autofocus />
    <div id="modal-error"></div>
    <button onclick="submitUsername()">Join</button>
  </div>
</div>

<!-- Chat UI (hidden until joined) -->
<div id="chat-wrap" style="display:none">
  <h2>💬 LAN Chat</h2>
  <div id="messages"></div>
  <div id="input-row">
    <input id="msg-input" type="text" maxlength="{{ config.get('CHAT_MAX_CHARS', 500) }}"
           placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>
  <div id="char-count">0 / {{ config.get('CHAT_MAX_CHARS', 500) }}</div>
  <div id="error-toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const MAX_CHARS = {{ config.get('CHAT_MAX_CHARS', 500) }};
  const socket = io();
  let myUsername = null;

  // ── Username modal ──────────────────────────────────────────────
  function submitUsername() {
    const username = document.getElementById("username-input").value.trim();
    if (!username) return;
    socket.emit("join_chat", { username });
  }

  document.getElementById("username-input").addEventListener("keydown", e => {
    if (e.key === "Enter") submitUsername();
  });

  socket.on("join_ack", data => {
    if (data.success) {
      myUsername = data.username;
      document.getElementById("modal-bg").style.display = "none";
      document.getElementById("chat-wrap").style.display = "block";
    } else {
      document.getElementById("modal-error").textContent = data.error;
    }
  });

  // ── History on join ─────────────────────────────────────────────
  socket.on("chat_history", data => {
    data.messages.forEach(m => appendMessage(m.username, m.message, m.timestamp));
  });

  // ── Incoming messages ────────────────────────────────────────────
  socket.on("new_message", data => {
    appendMessage(data.username, data.message, data.timestamp);
  });

  socket.on("user_joined", data => {
    appendSystem(`${data.username} joined the chat.`);
  });

  socket.on("user_left", data => {
    appendSystem(`${data.username} left the chat.`);
  });

  socket.on("error", data => {
    showError(data.message);
  });

  // ── Send ─────────────────────────────────────────────────────────
  function sendMessage() {
    const input = document.getElementById("msg-input");
    const text  = input.value.trim();
    if (!text) return;
    socket.emit("send_message", { message: text });
    input.value = "";
    document.getElementById("char-count").textContent = `0 / ${MAX_CHARS}`;
  }

  document.getElementById("msg-input").addEventListener("input", function () {
    document.getElementById("char-count").textContent = `${this.value.length} / ${MAX_CHARS}`;
  });

  // ── DOM helpers ───────────────────────────────────────────────────
  function appendMessage(username, text, ts) {
    const div  = document.createElement("div");
    const time = new Date(ts * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    div.className = "msg" + (username === myUsername ? " self" : "");
    div.innerHTML = `<span class="who">${escHtml(username)}</span>` +
                    `<span class="time" style="font-size:.75em;color:#aaa;margin-right:6px">${time}</span>` +
                    escHtml(text);
    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function appendSystem(text) {
    const div = document.createElement("div");
    div.className = "msg system";
    div.textContent = `— ${text}`;
    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  let errorTimer;
  function showError(msg) {
    const el = document.getElementById("error-toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(errorTimer);
    errorTimer = setTimeout(() => { el.style.display = "none"; }, 4000);
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
</script>
{% endblock %}
