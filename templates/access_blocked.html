<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANHub — Access Restricted</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 14px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .icon { font-size: 2.5rem; margin-bottom: .6rem; }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .4rem; color: #f87171; }
        p { color: #94a3b8; font-size: .9rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>LAN Only</h1>
        <p>This server is currently restricted to local network access only.<br>
           You must be connected to the same Wi-Fi or network as the server.</p>
    </div>
</body>
</html>
