name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Code Quality & Linting
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint isort mypy flake8 bandit pre-commit

    - name: Run Black (code formatting check)
      run: black --check --line-length=100 .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile=black .

    - name: Run Flake8 (linting)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pylint
      run: |
        pylint --max-line-length=100 functions/*.py shared/*.py app.py || true

    - name: Run Bandit (security check)
      run: bandit -r . --skip B101,B601 || true

    - name: Run pre-commit hooks
      run: pre-commit run --all-files || true

  # Unit & Integration Tests
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist flask flask-socketio werkzeug python-socketio

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=functions --cov=shared --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.13'
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Generate coverage badge
      if: matrix.python-version == '3.13'
      run: |
        echo "Coverage badge generated"

  # Type Checking
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-all

    - name: Run mypy
      run: mypy . --ignore-missing-imports --no-implicit-reexport --exclude=tests/ || true

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: bandit -r . -f json -o bandit-report.json || true

    - name: Check dependencies with Safety
      run: safety check --json || true

  # Build & Package Check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test, type-check]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Check if app can be imported
      run: |
        python -c "from app import app, socketio; print('✓ App imports successfully')"

    - name: Check if all modules can be imported
      run: |
        python -c "import functions as f; print('✓ Functions module loads'); print(f'  - {len([x for x in dir(f) if not x.startswith(\"_\")])} functions available')"

  # Documentation Check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check if documentation files exist
      run: |
        ls -la *.md
        echo "Documentation files:"
        ls -1 *.md | nl

    - name: Validate Markdown
      uses: nosborn/github-action-markdown-cli@v3.3.0
      with:
        files: .

  # Final status report
  status:
    name: Build Status
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, type-check, security, build, docs]

    steps:
    - name: Check jobs status
      run: |
        echo "=== CI/CD Pipeline Status ==="
        echo "Lint: ${{ needs.lint.result }}"
        echo "Tests: ${{ needs.test.result }}"
        echo "Type Check: ${{ needs.type-check.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Build: ${{ needs.build.result }}"
        echo "Docs: ${{ needs.docs.result }}"
        
        if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ CI/CD Pipeline FAILED"
          exit 1
        else
          echo "✓ CI/CD Pipeline PASSED"
        fi
