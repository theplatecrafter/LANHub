[pytest]
# Pytest configuration

# Minimum Python version
minversion = 7.0

# Python paths
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Test markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests between modules
    slow: Slow tests that take significant time
    database: Tests that use database operations
    socket: Tests for Socket.io functionality
    api: Tests for REST API endpoints
    skip_ci: Skip in CI/CD pipeline

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    if 0:
    if False:

[coverage:html]
directory = htmlcov
